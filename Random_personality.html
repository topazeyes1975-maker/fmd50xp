<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Roulette Engine</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --border-color: #2a2a2a;
            --accent-primary: #ff4500;
            --btn-bg: #8b0000;
            --btn-hover: #ff0000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .card { 
            border: 1px solid var(--border-color); 
            padding: 2.5rem; 
            border-radius: 12px; 
            width: 100%;
            max-width: 420px; 
            text-align: center; 
            background: var(--card-bg); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .description {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        #output { 
            margin: 25px 0; 
            line-height: 1.8; 
            font-size: 1.1rem; 
            text-align: left;
            background: #111;
            padding: 1.2rem;
            border-radius: 8px;
            border-left: 4px solid var(--accent-primary);
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .placeholder {
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            width: 100%;
        }

        .trait-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 4px 0;
        }

        .trait-row:last-child {
            border-bottom: none;
        }

        .trait-label {
            color: var(--accent-primary);
            font-weight: bold;
        }

        button { 
            width: 100%;
            padding: 14px 24px; 
            cursor: pointer; 
            background: var(--btn-bg); 
            border: none; 
            color: white; 
            font-weight: bold; 
            border-radius: 6px; 
            font-size: 1rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out; 
        }

        button:hover { 
            background: var(--btn-hover); 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Subtle spin fade effect */
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Personality Seed</h2>
        <p class="description">Instantly scramble a core identity for quick NPC generation or acting improv exercises.</p>
        
        <div id="output">
            <div class="placeholder">Click the chamber to generate a unique soul...</div>
        </div>
        
        <button onclick="rollCharacter()">Spin Roulette</button>
    </div>

    <script>
        const drives = [
            "Revenge", "Hoarding Knowledge", "Boredom", "Irrational Optimism", "Desperate Greed", 
            "Misplaced Loyalty", "Seeking Redemption", "Obsessive Perfectionism", "Fear of Being Forgotten", 
            "Craving Chaos", "Desire for Absolute Control", "Spiritual Enlightenment", "Pure Survival", 
            "Validation-Seeking", "Intellectual Superiority", "Hidden Altruism", "Resentment of Authority",
            "Nostalgia for a Lost Era", "Addiction to Adrenaline", "Unwavering Duty"
        ];

        const masks = [
            "Over-polite", "Aggressively Silent", "Uses Humor as a Weapon", "Strictly Transactional", 
            "Eerily Calm", "Brutally Honest", "Nervous Twitching", "Performative Charm", "Cynical Deflection", 
            "Coldly Analytical", "Over-Empathic", "Suspiciously Cheerful", "Melancholic Detachment", 
            "Stoic Endurance", "Manic Energy", "Arrogant Dismissal", "Soft-spoken Mystery", 
            "Constant Provocation", "Observant Wallflower", "Pseudo-Intellectual"
        ];

        const flaws = [
            "Paranoia", "Inability to trust logic", "Extreme risk-taking", "Pathological Liar", 
            "Physical Exhaustion", "Narcissism", "Cowardice", "Emotional Volatility", "Stubborn Refusal to Adapt", 
            "Obsessive-Compulsive Tendencies", "Slightly Delusional", "Superstitious Fear", "Self-Sabotage", 
            "Inhibited Empathy", "Addictive Personality", "Flashbacks to Trauma", "Hypochondria", 
            "Naivety", "Short-term Memory Gaps", "Hidden Sadism"
        ];

        function rollCharacter() {
            const drive = drives[Math.floor(Math.random() * drives.length)];
            const mask = masks[Math.floor(Math.random() * masks.length)];
            const flaw = flaws[Math.floor(Math.random() * flaws.length)];
            
            const outputDiv = document.getElementById('output');
            
            // Remove animation class to reset it
            outputDiv.classList.remove('fade-in');
            void outputDiv.offsetWidth; // Trigger reflow to restart animation
            
            outputDiv.innerHTML = `
                <div class="trait-row">
                    <span class="trait-label">Drive:</span>
                    <span>${drive}</span>
                </div>
                <div class="trait-row">
                    <span class="trait-label">Mask:</span>
                    <span>${mask}</span>
                </div>
                <div class="trait-row">
                    <span class="trait-label text-orange">Flaw:</span>
                    <span>${flaw}</span>
                </div>
            `;
            
            // Add animation class back
            outputDiv.classList.add('fade-in');
        }
    </script>
</body>
</html>
