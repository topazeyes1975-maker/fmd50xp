<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Broadcast Studio</title>
    <style>
        /* Modern, scannable, and fluid dark theme */
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Main player console using soft, circular styling */
        .radio-console {
            background: linear-gradient(145deg, #1f2833, #151a21);
            border-radius: 30px; /* Fluid, round borders */
            padding: 40px 30px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #45f3ff22;
        }

        /* Decorative circular glowing element representing broadcast pulse */
        .broadcast-pulse {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #45f3ff 20%, transparent 70%);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: pulse-ring 2.5s infinite ease-in-out;
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        p {
            color: #66fcf1;
            font-size: 0.95rem;
            margin: 0 0 30px 0;
            opacity: 0.8;
        }

        /* Station Hub Deck replacing the restrictive iframe */
        .station-deck {
            background: #020c1b;
            border-radius: 20px;
            padding: 50px 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            border: 1px solid #1f2833;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vinyl-graphic {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #0b0c10 30%, #202020 31%, #111 40%, #252525 50%, #0b0c10 70%);
            border-radius: 50%;
            margin-bottom: 30px;
            border: 4px solid #1f2833;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            animation: spin 6s linear infinite;
        }

        .vinyl-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35px;
            height: 35px;
            background-color: #45f3ff;
            border-radius: 50%;
        }

        /* Highly scannable, modern action link button */
        .tune-in-btn {
            display: inline-block;
            background: #45f3ff;
            color: #0b0c10;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px 40px;
            border-radius: 50px; /* Fully circular ends */
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .tune-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(69, 243, 255, 0.6);
            background: #ffffff;
        }

        /* Subtle ambient pulsing animation for the broadcast element */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="radio-console">
    <!-- Visual station indicator -->
    <div class="broadcast-pulse"></div>
    
    <h1>On-Air Radio</h1>
    <p>Streaming the latest tracking drops automatically</p>
    
    <div class="station-deck">
        <!-- Animated vinyl player element matching layout design rules -->
        <div class="vinyl-graphic">
            <div class="vinyl-center"></div>
        </div>
        
        <!-- Interactive direct pathway to your streaming playlist -->
        <a href="https://suno.com/playlist/1a2ed29d-7f8c-4f4c-a045-c69b65187faf" target="_blank" class="tune-in-btn">
            📻 Launch Live Radio
        </a>
    </div>
</div>

</body>
</html>
