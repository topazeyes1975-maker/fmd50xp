<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot DJ Studio</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .dj-console {
            background: linear-gradient(145deg, #1f2833, #151a21);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #45f3ff22;
        }

        /* Fluid circular interface design */
        .dj-head {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #202833 40%, #45f3ff 95%);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            position: relative;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Robot eye indicators */
        .dj-head::before, .dj-head::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #0b0c10;
            border-radius: 50%;
            margin: 0 10px;
            box-shadow: 0 0 8px #45f3ff;
            transition: background-color 0.3s;
        }

        .dj-head.talking::before, .dj-head.talking::after {
            background-color: #ffffff;
            animation: blink 0.2s infinite alternate;
        }

        h1 { color: #ffffff; margin: 0 0 5px 0; font-size: 1.6rem; }
        .status { color: #66fcf1; font-size: 0.9rem; margin-bottom: 25px; min-height: 20px; }

        .deck-interior {
            background: #020c1b;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .track-display {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .control-btn {
            background: #45f3ff;
            color: #0b0c10;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.3);
            transition: all 0.2s;
        }

        .control-btn:hover {
            transform: scale(1.03);
            background: #ffffff;
        }

        @keyframes blink {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

<div class="dj-console">
    <div class="dj-head" id="robotFace"></div>
    <h1>DJ Bot-Mixer</h1>
    <div class="status" id="djStatus">System Offline</div>

    <div class="deck-interior">
        <div class="track-display" id="currentTrack">Queue Empty</div>
        <button class="control-btn" id="powerBtn">▶ Start Party</button>
    </div>
</div>

<script>
    // 1. Array of your own downloaded songs stored on GitHub
    const myPlaylist = [
        { title: "First Custom Track", file: "audio/song1.mp3" },
        { title: "Midnight Session", file: "audio/song2.mp3" },
        { title: "Neon Skyline", file: "audio/song3.mp3" }
    ];

    // 2. Robot personality script lines
    const robotIntros = [
        "Beep boop! Spinning up a certified banger right now. Check this out.",
        "Dropping into the matrix matrix grid. Let's shift the frequency with this next track.",
        "Analyzing audio layers. This track matches premium data parameters. Initiating playback.",
        "A calculation of pure rhythm incoming. Enjoy the sound waves."
    ];

    const audioPlayer = new Audio();
    let isPlaying = false;
    let currentSongIndex = -1;

    const robotFace = document.getElementById('robotFace');
    const djStatus = document.getElementById('djStatus');
    const currentTrack = document.getElementById('currentTrack');
    const powerBtn = document.getElementById('powerBtn');

    // Speech Engine Setup
    const synth = window.speechSynthesis;

    function speakIntro(callback) {
        // Stop any text speech happening right now
        synth.cancel(); 
        
        // Pick a random robotic catchphrase
        const randomPhrase = robotIntros[Math.floor(Math.random() * robotIntros.length)];
        const utterance = new SpeechSynthesisUtterance(randomPhrase);
        
        // Give him a fun computer voice style modulation
        utterance.pitch = 0.5; // Deeper or higher pitch adjustments
        utterance.rate = 1.0;  // Pacing

        // Visual effects while speaking
        robotFace.classList.add('talking');
        djStatus.innerText = "🤖 DJ Bot is speaking...";

        utterance.onend = () => {
            robotFace.classList.remove('talking');
            callback(); // Run the track playback immediately when he is done speaking
        };

        synth.speak(utterance);
    }

    function playRandomSong() {
        // Simple random shuffler
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * myPlaylist.length);
        } while (newIndex === currentSongIndex && myPlaylist.length > 1);

        currentSongIndex = newIndex;
        const song = myPlaylist[currentSongIndex];

        // Let the Robot talk first!
        speakIntro(() => {
            audioPlayer.src = song.file;
            currentTrack.innerText = song.title;
            djStatus.innerText = "🎵 Streaming track data...";
            audioPlayer.play();
        });
    }

    powerBtn.addEventListener('click', () => {
        if (!isPlaying) {
            isPlaying = true;
            powerBtn.innerText = "⏸ Pause Deck";
            playRandomSong();
        } else {
            isPlaying = false;
            audioPlayer.pause();
            synth.cancel();
            robotFace.classList.remove('talking');
            powerBtn.innerText = "▶ Resume Deck";
            djStatus.innerText = "Deck Paused";
        }
    });

    // Auto-mix rule: When a song ends, automatically call the DJ back to queue the next one!
    audioPlayer.addEventListener('ended', () => {
        if (isPlaying) {
            playRandomSong();
        }
    });
</script>

</body>
</html>
