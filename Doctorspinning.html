<!DOCTYPE html>
<html language="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Doctor Who: Angel Staredown</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000; /* Pure black background to make images pop */
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            width: 100vw;
            justify-content: flex-end; /* Pushes content down towards the controller space */
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            margin-bottom: 10px; /* Snaps closer down to the joystick area */
        }

        canvas {
            /* Replace 'YOUR_BACKGROUND_IMAGE_URL_HERE.jpg' with your background image path or URL */
            background: #020813 url('YOUR_BACKGROUND_IMAGE_URL_HERE.jpg') no-repeat center center;
            background-size: cover; 
            display: block;
            width: 100vw;
            height: calc(100vw * 0.75); 
            max-height: 65vh;
            box-sizing: border-box;
            border-bottom: 2px solid rgba(0, 162, 255, 0.3);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px; 
            font-weight: bold;
            text-shadow: 2px 2px 5px #000, -1px -1px 2px #000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 5;
        }

        #healthContainer {
            width: 160px; 
            height: 16px; 
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 2px;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background: #00ff55;
        }

        /* Controls Area sits beautifully at the bottom with reduced empty padding */
        #controlsArea {
            width: 100vw;
            height: 180px; /* Tightened height to minimize empty space */
            position: relative;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
        }

        #touchZone {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid #00a2ff;
            border-radius: 50%;
            touch-action: none;
            position: relative;
        }

        #joystick {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: #00a2ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00a2ff;
        }

        /* --- GLOBAL LEADERBOARD OVERLAY --- */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }
        #gameOverScreen h1 {
            color: #ff3333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .final-stats {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00a2ff;
        }
        #initialsInput {
            background: #112233;
            border: 2px solid #00a2ff;
            color: #fff;
            font-size: 20px;
            text-align: center;
            width: 80px;
            padding: 5px;
            text-transform: uppercase;
        }
        .submit-btn {
            background: #00a2ff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            font-weight: bold;
        }
        #leaderboard {
            width: 90%;
            max-width: 360px;
            border-collapse: collapse;
        }
        #leaderboard th {
            border-bottom: 2px solid #00a2ff;
            color: #ffcc00;
            padding: 4px;
        }
        #leaderboard td {
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
        }
        .restart-btn {
            background: #ffcc00;
            color: #050b14;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>Score: <span id="scoreVal">0</span></div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>HP:</span>
            <div id="healthContainer">
                <div id="healthBar"></div>
            </div>
        </div>
        <div>Time Survived: <span id="timerVal">0s</span></div>
        <div id="status" style="color: #ffcc00; margin-top: 2px; font-size: 16px;">Status: Moving</div>
    </div>

    <div id="gameOverScreen">
        <h1>THE ANGELS CAUGHT YOU</h1>
        <div class="final-stats" id="finalStatsText">Score: 0 | Time: 0s</div>
        
        <div id="initialsForm">
            <p style="margin-bottom: 10px; color: #aaa; font-size: 13px;">Enter Initials for the Top Scale:</p>
            <input type="text" id="initialsInput" maxlength="3" placeholder="AAA" autocomplete="off">
            <button class="submit-btn" id="submitScoreBtn">SUBMIT</button>
        </div>

        <h3 style="color: #ffcc00; margin: 5px 0; font-size: 15px;">GLOBAL TOP SCALE</h3>
        <table id="leaderboard">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Initials</th>
                    <th>Score</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="4" style="color:#aaa;">Loading scores...</td></tr>
            </tbody>
        </table>
        
        <button class="restart-btn" id="restartGameBtn" style="display: none;">RUN AGAIN</button>
    </div>
</div>

<div id="controlsArea">
    <div id="touchZone">
        <div id="joystick"></div>
    </div>
</div>

<script>
// --- SUPABASE CONNECTIVITY SETUP ---
const SUPABASE_URL = "https://vvpddhoytpmtnqyvdqgb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_41PPeNX3wc_dlOQP-vpoyA_MOz6RGZg";

const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 600;

// --- IMAGE CONFIGURATION ---
const IMAGES = {
    doctor: "1781663748439.png",        
    angel: "1781661837743.png",         
    littleMonster: "1781662479960.png", 
    tardis: "1781661908170.png",        
    sonic: "1781661732492.png",         
    energyBall: "1781662897974.png"     
};

const sprites = {};
let imagesLoaded = 0;
let useImages = false;

for (let key in IMAGES) {
    if (IMAGES[key]) {
        sprites[key] = new Image();
        sprites[key].src = IMAGES[key];
        sprites[key].onload = () => {
            imagesLoaded++;
            if (imagesLoaded === Object.keys(IMAGES).length) useImages = true;
        };
        sprites[key].onerror = () => {
            console.log("Fallback colors active for asset: " + key);
        };
    }
}

// --- GAME STATE ---
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 22, 
    speed: 5,
    hp: 100,
    score: 0,
    isMoving: false,
    sonicRotation: 0,
    maxSonics: 6,
    sonicDistance: 68,
    regenTimer: 0
};

let sonics = Array(player.maxSonics).fill(true);
let input = { x: 0, y: 0 };
let angels = [];
let littleMonsters = []; 
let energyBalls = [];
let tardisBoxes = [];
let startTime = Date.now();
let timeSurvived = 0;
let isGameOver = false;

function spawnTardis() {
    tardisBoxes.push({
        x: Math.random() * (canvas.width - 80) + 40,
        y: Math.random() * (canvas.height - 90) + 45,
        width: 50,  /* Expanded from 35 to 50 so it's a realistic police box shape */
        height: 65  /* Expanded from 50 to 65 */
    });
}
for(let i=0; i<3; i++) spawnTardis();

function spawnAngel() {
    if (isGameOver) return;
    let side = Math.random();
    let x, y;
    if (side < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }
    angels.push({
        x: x,
        y: y,
        radius: 28, /* Scaled up from 20 to 28 so angels appear larger and clear */
        speed: 1.4,
        state: 'chasing',
        fleeTimer: 0
    });
}
setInterval(spawnAngel, 3500);

function spawnLittleMonster() {
    if (isGameOver) return;
    let side = Math.random();
    let x, y;
    if (side < 0.5) {
        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
    }
    littleMonsters.push({
        x: x,
        y: y,
        radius: 18, /* Scaled up from 12 to 18 to fix small sprite look */      
        speed: 2.4,       
        state: 'approaching', 
        dropTimer: 0
    });
}
setInterval(spawnLittleMonster, 2000);

// --- TOUCH ZONE MAPPING ---
const touchZone = document.getElementById('touchZone');
const joystick = document.getElementById('joystick');
let joystickActive = false;
let startX = 0, startY = 0;

touchZone.addEventListener('touchstart', (e) => {
    if (isGameOver) return;
    joystickActive = true;
    const touch = e.touches[0];
    const rect = touchZone.getBoundingClientRect();
    startX = rect.left + rect.width / 2;
    startY = rect.top + rect.height / 2;
});

touchZone.addEventListener('touchmove', (e) => {
    if (!joystickActive || isGameOver) return;
    e.preventDefault();
    const touch = e.touches[0];
    let dx = touch.clientX - startX;
    let dy = touch.clientY - startY;
    let distance = Math.sqrt(dx*dx + dy*dy);
    let maxRadius = 40;

    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
    }
    joystick.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / maxRadius;
    input.y = dy / maxRadius;
});

touchZone.addEventListener('touchend', () => {
    joystickActive = false;
    joystick.style.transform = `translate(0px, 0px)`;
    input.x = 0;
    input.y = 0;
});

function checkMovementInput() {
    if (joystickActive && (Math.abs(input.x) > 0.05 || Math.abs(input.y) > 0.05)) {
        player.isMoving = true;
    } else {
        player.isMoving = false;
    }
}

// --- SUPABASE DATA HANDLERS ---
async function fetchGlobalLeaderboard() {
    if (!db) return;
    try {
        const { data, error } = await db
            .from('doctor_leaderboard')
            .select('*')
            .order('score', { ascending: false })
            .limit(5);

        if (error) throw error;
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = "";

        for (let i = 0; i < 5; i++) {
            const row = document.createElement('tr');
            if (data && data[i]) {
                row.innerHTML = `<td>#${i + 1}</td><td>${data[i].initials}</td><td>${data[i].score}</td><td>${data[i].time_survived}s</td>`;
            } else {
                row.innerHTML = `<td>#${i + 1}</td><td>---</td><td>0</td><td>0s</td>`;
            }
            tbody.appendChild(row);
        }
    } catch (err) {
        console.error(err);
    }
}

async function triggerGameOver() {
    isGameOver = true;
    player.isMoving = false;
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('finalStatsText').innerText = `Score: ${player.score} | Time: ${timeSurvived}s`;
    document.getElementById('initialsForm').style.display = 'block';
    document.getElementById('restartGameBtn').style.display = 'none';
    await fetchGlobalLeaderboard();
}

document.getElementById('submitScoreBtn').addEventListener('click', async () => {
    let initials = document.getElementById('initialsInput').value.trim().toUpperCase();
    if (initials.length < 1) initials = "DOC"; 
    
    document.getElementById('submitScoreBtn').innerText = "SAVING...";
    if (db) {
        try {
            await db.from('doctor_leaderboard').insert([{ initials: initials, score: player.score, time_survived: timeSurvived }]);
        } catch (err) {
            console.error(err);
        }
    }
    await fetchGlobalLeaderboard();
    document.getElementById('submitScoreBtn').innerText = "SUBMIT";
    document.getElementById('initialsForm').style.display = 'none';
    document.getElementById('restartGameBtn').style.display = 'block';
});

document.getElementById('restartGameBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').style.display = 'none';
    player.hp = 100;
    player.score = 0;
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    startTime = Date.now();
    angels = [];
    littleMonsters = [];
    energyBalls = [];
    sonics.fill(true);
    isGameOver = false;
});

// --- FRAME MECHANICS LOOP ---
function update() {
    if (isGameOver) return;

    checkMovementInput();

    timeSurvived = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timerVal').innerText = timeSurvived + "s";

    const healthBar = document.getElementById('healthBar');
    if (healthBar) healthBar.style.width = player.hp + "%";

    if (player.isMoving) {
        player.x += input.x * player.speed;
        player.y += input.y * player.speed;
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
        
        player.sonicRotation += 0.08;
        
        let activeCount = sonics.filter(s => s).length;
        if (activeCount === 0) {
            document.getElementById('status').innerText = "RUN! Shield Shattered!";
            document.getElementById('status').style.color = "#ff3333";
        } else {
            document.getElementById('status').innerText = "Status: Moving (Sonic Active)";
            document.getElementById('status').style.color = "#00a2ff";
        }
    } else {
        document.getElementById('status').innerText = "Status: Staring (Angels Frozen)";
        document.getElementById('status').style.color = "#ffcc00";
    }

    player.regenTimer++;
    if (player.regenTimer % 150 === 0) { 
        for (let i = 0; i < sonics.length; i++) {
            if (!sonics[i]) {
                sonics[i] = true;
                break;
            }
        }
    }

    if (!player.isMoving) return; 

    littleMonsters.forEach((little, index) => {
        let dx = player.x - little.x;
        let dy = player.y - little.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (little.state === 'approaching') {
            little.x += (dx / dist) * little.speed;
            little.y += (dy / dist) * little.speed;

            if (dist < player.sonicDistance) little.state = 'runningAway';
            if (dist < player.radius + little.radius) {
                player.hp -= 1.5; 
                if (player.hp <= 0) { triggerGameOver(); }
            }
        } else if (little.state === 'runningAway') {
            little.x -= (dx / dist) * (little.speed * 1.2);
            little.y -= (dy / dist) * (little.speed * 1.2);
            little.dropTimer++;
            if (little.dropTimer % 20 === 0) energyBalls.push({ x: little.x, y: little.y, radius: 12 }); /* Balls up to 12 */
            if (little.x < -50 || little.x > canvas.width + 50 || little.y < -50 || little.y > canvas.height + 50) {
                littleMonsters.splice(index, 1);
            }
        }
    });

    angels.forEach((angel, index) => {
        let dx = player.x - angel.x;
        let dy = player.y - angel.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (angel.state === 'chasing') {
            angel.x += (dx / dist) * angel.speed;
            angel.y += (dy / dist) * angel.speed;

            if (dist < player.radius + angel.radius) {
                player.hp -= 20; 
                angels.splice(index, 1);
                if (player.hp <= 0) { triggerGameOver(); }
                return;
            }

            for (let i = 0; i < player.maxSonics; i++) {
                if (!sonics[i]) continue; 
                let angle = player.sonicRotation + (i * (Math.PI * 2 / player.maxSonics));
                let sonicX = player.x + Math.cos(angle) * player.sonicDistance;
                let sonicY = player.y + Math.sin(angle) * player.sonicDistance;
                let sDx = angel.x - sonicX;
                let sDy = angel.y - sonicY;
                if (Math.sqrt(sDx*sDx + sDy*sDy) < angel.radius + 12) {
                    angel.state = 'fleeing';
                    angel.fleeTimer = 100;
                    energyBalls.push({ x: angel.x, y: angel.y, radius: 14 }); /* Scaled energy drops */
                    sonics[i] = false; 
                }
            }
        } else if (angel.state === 'fleeing') {
            angel.x -= (dx / dist) * (angel.speed * 1.5);
            angel.y -= (dy / dist) * (angel.speed * 1.5);
            angel.fleeTimer--;
            if (angel.fleeTimer <= 0) angel.state = 'chasing';
        }
    });

    energyBalls.forEach((ball, index) => {
        let dx = player.x - ball.x;
        let dy = player.y - ball.y;
        if (Math.sqrt(dx*dx + dy*dy) < player.radius + ball.radius) {
            player.score += 10;
            energyBalls.splice(index, 1);
        }
    });

    tardisBoxes.forEach((box) => {
        let closestX = Math.max(box.x, Math.min(player.x, box.x + box.width));
        let closestY = Math.max(box.y, Math.min(player.y, box.y + box.height));
        let dx = player.x - closestX;
        let dy = player.y - closestY;
        if (Math.sqrt(dx*dx + dy*dy) < player.radius) {
            if(player.hp < 100) {
                player.hp = Math.min(100, player.hp + 25);
                box.x = Math.random() * (canvas.width - 80) + 40;
                box.y = Math.random() * (canvas.height - 90) + 45;
            }
        }
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    tardisBoxes.forEach(box => {
        if (useImages && sprites.tardis) {
            ctx.drawImage(sprites.tardis, box.x, box.y, box.width, box.height);
        } else {
            ctx.fillStyle = '#003b6f'; ctx.fillRect(box.x, box.y, box.width, box.height);
        }
    });

    energyBalls.forEach(ball => {
        if (useImages && sprites.energyBall) {
            ctx.drawImage(sprites.energyBall, ball.x - ball.radius, ball.y - ball.radius, ball.radius*2, ball.radius*2);
        } else {
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = '#00ffcc'; ctx.fill();
        }
    });

    if (useImages && sprites.doctor) {
        ctx.drawImage(sprites.doctor, player.x - player.radius, player.y - player.radius, player.radius*2, player.radius*2);
    } else {
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fillStyle = '#9e782f'; ctx.fill();
    }

    for (let i = 0; i < player.maxSonics; i++) {
        if (!sonics[i]) continue; 
        let angle = player.sonicRotation + (i * (Math.PI * 2 / player.maxSonics));
        let sonicX = player.x + Math.cos(angle) * player.sonicDistance;
        let sonicY = player.y + Math.sin(angle) * player.sonicDistance;
        if (useImages && sprites.sonic) {
            ctx.save(); ctx.translate(sonicX, sonicY); ctx.rotate(angle + Math.PI / 2); ctx.drawImage(sprites.sonic, -10, -22, 20, 44); ctx.restore();
        } else {
            ctx.beginPath(); ctx.arc(sonicX, sonicY, 7, 0, Math.PI*2); ctx.fillStyle = '#00ff55'; ctx.fill();
        }
    }

    littleMonsters.forEach(little => {
        if (useImages && sprites.littleMonster) {
            ctx.drawImage(sprites.littleMonster, little.x - little.radius, little.y - little.radius, little.radius*2, little.radius*2);
        } else {
            ctx.beginPath(); ctx.arc(little.x, little.y, little.radius, 0, Math.PI*2); ctx.fillStyle = '#bbbbbb'; ctx.fill();
        }
    });

    angels.forEach(angel => {
        if (useImages && sprites.angel) {
            ctx.drawImage(sprites.angel, angel.x - angel.radius, angel.y - angel.radius, angel.radius*2, angel.radius*2);
        } else {
            ctx.beginPath(); ctx.arc(angel.x, angel.y, angel.radius, 0, Math.PI*2); ctx.fillStyle = '#888888'; ctx.fill();
        }
    });
}

function loop() {
    update();
    render();
    const scoreVal = document.getElementById('scoreVal');
    if (scoreVal) scoreVal.innerText = player.score;
    requestAnimationFrame(loop);
}

fetchGlobalLeaderboard();
loop();
</script>
</body>
</html>
