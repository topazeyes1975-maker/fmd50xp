<!DOCTYPE html>
<html language="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doctor Who: Angel Staredown</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050b14;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
        }
        canvas {
            background: #112233;
            display: block;
            width: 100%;
            height: 100%;
            border: 2px solid #00a2ff;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
        }
        #healthContainer {
            width: 160px;
            height: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 2px;
        }
        #healthBar {
            width: 100%;
            height: 100%;
            background: #00ff55;
            transition: width 0.1s ease, background-color 0.3s ease;
        }
        #touchZone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 5;
        }
        #joystick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: #00a2ff;
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
        }

        /* --- GLOBAL LEADERBOARD OVERLAY --- */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.95);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }
        #gameOverScreen h1 {
            color: #ff3333;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
        .final-stats {
            font-size: 20px;
            margin-bottom: 15px;
            color: #00a2ff;
        }
        #initialsForm {
            margin-bottom: 20px;
        }
        #initialsInput {
            background: #112233;
            border: 2px solid #00a2ff;
            color: #fff;
            font-size: 24px;
            text-align: center;
            width: 90px;
            padding: 5px;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-radius: 5px;
        }
        #initialsInput:focus {
            outline: none;
            box-shadow: 0 0 15px #00a2ff;
        }
        .submit-btn {
            background: #00a2ff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-left: 10px;
            vertical-align: middle;
        }
        .submit-btn:hover {
            background: #00d2ff;
        }
        
        /* --- GLOBAL LEADERBOARD SCALER TABLE --- */
        #leaderboard {
            width: 85%;
            max-width: 450px;
            border-collapse: collapse;
            margin-top: 10px;
        }
        #leaderboard th {
            border-bottom: 2px solid #00a2ff;
            color: #ffcc00;
            padding: 6px;
            font-size: 15px;
        }
        #leaderboard td {
            padding: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            font-family: monospace;
        }
        .restart-btn {
            background: #ffcc00;
            color: #050b14;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
        .restart-btn:hover {
            background: #fff;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div>Score: <span id="scoreVal">0</span></div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>HP:</span>
            <div id="healthContainer">
                <div id="healthBar"></div>
            </div>
        </div>
        <div>Time Survived: <span id="timerVal">0s</span></div>
        <div id="status" style="color: #ffcc00; margin-top: 5px;">Status: Moving (Sonic Active)</div>
    </div>
    
    <div id="touchZone">
        <div id="joystick"></div>
    </div>

    <div id="gameOverScreen">
        <h1>THE ANGELS CAUGHT YOU</h1>
        <div class="final-stats" id="finalStatsText">Score: 0 | Time: 0s</div>
        
        <div id="initialsForm">
            <p style="margin-bottom: 10px; color: #aaa; font-size: 15px;">Enter Initials (3 Digits) for the Top Scale:</p>
            <input type="text" id="initialsInput" maxlength="3" placeholder="AAA" autocomplete="off">
            <button class="submit-btn" id="submitScoreBtn">SUBMIT</button>
        </div>

        <h3 style="color: #ffcc00; margin: 5px 0;">GLOBAL TOP SCALE</h3>
        <table id="leaderboard">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Initials</th>
                    <th>Score</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="4" style="color:#aaa;">Loading scores...</td></tr>
            </tbody>
        </table>
        
        <button class="restart-btn" id="restartGameBtn" style="display: none;">RUN AGAIN</button>
    </div>
</div>

<script>
// --- SUPABASE CONNECTIVITY SETUP ---
// Use the credentials from your existing Hex or Cryptogram project here!
const SUPABASE_URL = "YOUR_EXISTING_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_EXISTING_PROJECT_ANON_KEY";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 600;

// --- IMAGE CONFIGURATION ---
const IMAGES = {
    doctor: "",        
    angel: "",         
    littleMonster: "", 
    tardis: "",        
    sonic: "",         
    energyBall: ""     
};

const sprites = {};
let imagesLoaded = 0;
let useImages = false;

for (let key in IMAGES) {
    if (IMAGES[key]) {
        sprites[key] = new Image();
        sprites[key].src = IMAGES[key];
        sprites[key].onload = () => {
            imagesLoaded++;
            if (imagesLoaded === Object.keys(IMAGES).length) useImages = true;
        };
    }
}

// --- GAME STATE ---
let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 20,
    speed: 4,
    hp: 100,
    score: 0,
    isMoving: false,
    sonicRotation: 0,
    maxSonics: 6,
    sonicDistance: 65,
    regenTimer: 0
};

let sonics = Array(player.maxSonics).fill(true);
let input = { x: 0, y: 0 };
let angels = [];
let littleMonsters = []; 
let energyBalls = [];
let tardisBoxes = [];
let startTime = Date.now();
let timeSurvived = 0;
let isGameOver = false;

function spawnTardis() {
    tardisBoxes.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: Math.random() * (canvas.height - 60) + 30,
        width: 30,
        height: 45
    });
}
for(let i=0; i<3; i++) spawnTardis();

function spawnAngel() {
    if (isGameOver) return;
    let side = Math.random();
    let x, y;
    if (side < 0.5) {
        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
    }
    angels.push({
        x: x,
        y: y,
        radius: 18,
        speed: 1.2,
        state: 'chasing',
        fleeTimer: 0
    });
}
setInterval(spawnAngel, 3500);

function spawnLittleMonster() {
    if (isGameOver) return;
    let side = Math.random();
    let x, y;
    if (side < 0.5) {
        x = Math.random() < 0.5 ? -10 : canvas.width + 10;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -10 : canvas.height + 10;
    }
    littleMonsters.push({
        x: x,
        y: y,
        radius: 10,       
        speed: 2.2,       
        state: 'approaching', 
        dropTimer: 0
    });
}
setInterval(spawnLittleMonster, 2000);

// --- TOUCH / JOYSTICK ---
const touchZone = document.getElementById('touchZone');
const joystick = document.getElementById('joystick');
let joystickActive = false;
let startX = 0, startY = 0;

touchZone.addEventListener('touchstart', (e) => {
    if (isGameOver) return;
    joystickActive = true;
    const touch = e.touches[0];
    const rect = touchZone.getBoundingClientRect();
    startX = rect.left + rect.width / 2;
    startY = rect.top + rect.height / 2;
});

touchZone.addEventListener('touchmove', (e) => {
    if (!joystickActive || isGameOver) return;
    e.preventDefault();
    const touch = e.touches[0];
    let dx = touch.clientX - startX;
    let dy = touch.clientY - startY;
    let distance = Math.sqrt(dx*dx + dy*dy);
    let maxRadius = 40;

    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
    }
    joystick.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / maxRadius;
    input.y = dy / maxRadius;
});

touchZone.addEventListener('touchend', () => {
    joystickActive = false;
    joystick.style.transform = `translate(0px, 0px)`;
    input.x = 0;
    input.y = 0;
});

// --- KEYBOARD CONTROLS ---
let keys = {};
window.addEventListener('keydown', e => { if(!isGameOver) keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function checkMovementInput() {
    let kbX = 0; let kbY = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) kbX = -1;
    if (keys['KeyD'] || keys['ArrowRight']) kbX = 1;
    if (keys['KeyW'] || keys['ArrowUp']) kbY = -1;
    if (keys['KeyS'] || keys['ArrowDown']) kbY = 1;

    if (kbX !== 0 || kbY !== 0) {
        input.x = kbX; input.y = kbY;
        player.isMoving = true;
    } else if (joystickActive && (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1)) {
        player.isMoving = true;
    } else {
        player.isMoving = false;
    }
}

// --- SUPABASE DATABASE INTERACTIONS ---
async function fetchGlobalLeaderboard() {
    try {
        // Points to the specific shared table for this game
        const { data, error } = await supabase
            .from('doctor_leaderboard')
            .select('*')
            .order('score', { ascending: false })
            .limit(5);

        if (error) throw error;

        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = "";

        for (let i = 0; i < 5; i++) {
            const row = document.createElement('tr');
            if (data && data[i]) {
                row.innerHTML = `
                    <td>#${i + 1}</td>
                    <td>${data[i].initials}</td>
                    <td>${data[i].score}</td>
                    <td>${data[i].time_survived}s</td>
                `;
            } else {
                row.innerHTML = `<td>#${i + 1}</td><td>---</td><td>0</td><td>0s</td>`;
            }
            tbody.appendChild(row);
        }
    } catch (err) {
        console.error("Error pulling database stats:", err);
    }
}

async function triggerGameOver() {
    isGameOver = true;
    player.isMoving = false;
    
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('finalStatsText').innerText = `Score: ${player.score} | Time Survived: ${timeSurvived}s`;
    
    document.getElementById('initialsForm').style.display = 'block';
    document.getElementById('restartGameBtn').style.display = 'none';
    document.getElementById('initialsInput').value = "";
    
    await fetchGlobalLeaderboard();
}

// Submit button tracking
document.getElementById('submitScoreBtn').addEventListener('click', async () => {
    let initials = document.getElementById('initialsInput').value.trim().toUpperCase();
    if (initials.length < 1) initials = "DOC"; 
    
    document.getElementById('submitScoreBtn').innerText = "SAVING...";

    try {
        const { error } = await supabase
            .from('doctor_leaderboard')
            .insert([
                { initials: initials, score: player.score, time_survived: timeSurvived }
            ]);

        if (error) throw error;

    } catch (err) {
        console.error("Could not write to Supabase backend:", err);
    }

    await fetchGlobalLeaderboard();
    document.getElementById('submitScoreBtn').innerText = "SUBMIT";
    document.getElementById('initialsForm').style.display = 'none';
    document.getElementById('restartGameBtn').style.display = 'block';
});

// Restart button tracking
document.getElementById('restartGameBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').style.display = 'none';
    player.hp = 100;
    player.score = 0;
    startTime = Date.now();
    angels = [];
    littleMonsters = [];
    energyBalls = [];
    sonics.fill(true);
    isGameOver = false;
});


// --- GAME LOOP ---
function update() {
    if (isGameOver) return;

    checkMovementInput();

    timeSurvived = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timerVal').innerText = timeSurvived + "s";

    const healthBar = document.getElementById('healthBar');
    healthBar.style.width = player.hp + "%";
    if (player.hp > 50) healthBar.style.backgroundColor = "#00ff55";
    else if (player.hp > 25) healthBar.style.backgroundColor = "#ffcc00";
    else healthBar.style.backgroundColor = "#ff3333";

    if (player.isMoving) {
        player.x += input.x * player.speed;
        player.y += input.y * player.speed;
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
        
        player.sonicRotation += 0.08;
        
        let activeCount = sonics.filter(s => s).length;
        if (activeCount === 0) {
            document.getElementById('status').innerText = "RUN! Sonic Shield Shattered!";
            document.getElementById('status').style.color = "#ff3333";
        } else {
            document.getElementById('status').innerText = "Status: Moving (Sonic Active)";
            document.getElementById('status').style.color = "#00a2ff";
        }
    } else {
        document.getElementById('status').innerText = "Status: Staring (Angels Frozen)";
        document.getElementById('status').style.color = "#ffcc00";
    }

    player.regenTimer++;
    if (player.regenTimer % 180 === 0) { 
        for (let i = 0; i < sonics.length; i++) {
            if (!sonics[i]) {
                sonics[i] = true;
                break;
            }
        }
    }

    if (!player.isMoving) return; 

    // --- UPDATE LITTLE MONSTERS ---
    littleMonsters.forEach((little, index) => {
        let dx = player.x - little.x;
        let dy = player.y - little.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (little.state === 'approaching') {
            little.x += (dx / dist) * little.speed;
            little.y += (dy / dist) * little.speed;

            if (dist < player.sonicDistance) {
                little.state = 'runningAway';
            }
            if (dist < player.radius + little.radius) {
                player.hp -= 1.5; 
                if (player.hp <= 0) { triggerGameOver(); return; }
            }
        } else if (little.state === 'runningAway') {
            little.x -= (dx / dist) * (little.speed * 1.2);
            little.y -= (dy / dist) * (little.speed * 1.2);

            little.dropTimer++;
            if (little.dropTimer % 20 === 0) {
                energyBalls.push({ x: little.x, y: little.y, radius: 7 });
            }
            if (little.x < -50 || little.x > canvas.width + 50 || little.y < -50 || little.y > canvas.height + 50) {
                littleMonsters.splice(index, 1);
            }
        }
    });

    // --- UPDATE BIG ANGELS ---
    angels.forEach((angel, index) => {
        let dx = player.x - angel.x;
        let dy = player.y - angel.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (angel.state === 'chasing') {
            angel.x += (dx / dist) * angel.speed;
            angel.y += (dy / dist) * angel.speed;

            if (dist < player.radius + angel.radius) {
                player.hp -= 20; 
                angels.splice(index, 1);
                if (player.hp <= 0) { triggerGameOver(); }
                return;
            }

            for (let i = 0; i < player.maxSonics; i++) {
                if (!sonics[i]) continue; 

                let angle = player.sonicRotation + (i * (Math.PI * 2 / player.maxSonics));
                let sonicX = player.x + Math.cos(angle) * player.sonicDistance;
                let sonicY = player.y + Math.sin(angle) * player.sonicDistance;

                let sDx = angel.x - sonicX;
                let sDy = angel.y - sonicY;
                let sDist = Math.sqrt(sDx * sDx + sDy * sDy);

                if (sDist < angel.radius + 12) {
                    angel.state = 'fleeing';
                    angel.fleeTimer = 100;
                    energyBalls.push({ x: angel.x, y: angel.y, radius: 8 });
                    sonics[i] = false; 
                }
            }
        } else if (angel.state === 'fleeing') {
            angel.x -= (dx / dist) * (angel.speed * 1.5);
            angel.y -= (dy / dist) * (angel.speed * 1.5);
            angel.fleeTimer--;
            if (angel.fleeTimer <= 0) angel.state = 'chasing';
        }
    });

    // Collect Energy Balls
    energyBalls.forEach((ball, index) => {
        let dx = player.x - ball.x;
        let dy = player.y - ball.y;
        if (Math.sqrt(dx*dx + dy*dy) < player.radius + ball.radius) {
            player.score += 10;
            energyBalls.splice(index, 1);
        }
    });

    // Hidden TARDIS Boxes
    tardisBoxes.forEach((box) => {
        let closestX = Math.max(box.x, Math.min(player.x, box.x + box.width));
        let closestY = Math.max(box.y, Math.min(player.y, box.y + box.height));
        let dx = player.x - closestX;
        let dy = player.y - closestY;
        
        if (Math.sqrt(dx*dx + dy*dy) < player.radius) {
            if(player.hp < 100) {
                player.hp = Math.min(100, player.hp + 25);
                box.x = Math.random() * (canvas.width - 60) + 30;
                box.y = Math.random() * (canvas.height - 60) + 30;
            }
        }
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    tardisBoxes.forEach(box => {
        if (useImages && sprites.tardis) {
            ctx.drawImage(sprites.tardis, box.x, box.y, box.width, box.height);
        } else {
            ctx.fillStyle = '#003b6f'; 
            ctx.fillRect(box.x, box.y, box.width, box.height);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(box.x, box.y, box.width, box.height);
        }
    });

    energyBalls.forEach(ball => {
        if (useImages && sprites.energyBall) {
            ctx.drawImage(sprites.energyBall, ball.x - ball.radius, ball.y - ball.radius, ball.radius*2, ball.radius*2);
        } else {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = '#00ffcc';
            ctx.fill();
        }
    });

    if (useImages && sprites.doctor) {
        ctx.drawImage(sprites.doctor, player.x - player.radius, player.y - player.radius, player.radius*2, player.radius*2);
    } else {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
        ctx.fillStyle = '#9e782f'; 
        ctx.fill();
    }

    for (let i = 0; i < player.maxSonics; i++) {
        if (!sonics[i]) continue; 

        let angle = player.sonicRotation + (i * (Math.PI * 2 / player.maxSonics));
        let sonicX = player.x + Math.cos(angle) * player.sonicDistance;
        let sonicY = player.y + Math.sin(angle) * player.sonicDistance;

        if (useImages && sprites.sonic) {
            ctx.save();
            ctx.translate(sonicX, sonicY);
            ctx.rotate(angle);
            ctx.drawImage(sprites.sonic, -8, -20, 16, 40);
            ctx.restore();
        } else {
            ctx.beginPath();
            ctx.arc(sonicX, sonicY, 6, 0, Math.PI*2);
            ctx.fillStyle = player.isMoving ? '#00ff55' : '#555555'; 
            ctx.fill();
        }
    }

    littleMonsters.forEach(little => {
        if (useImages && sprites.littleMonster) {
            ctx.drawImage(sprites.littleMonster, little.x - little.radius, little.y - little.radius, little.radius*2, little.radius*2);
        } else {
            ctx.beginPath();
            ctx.arc(little.x, little.y, little.radius, 0, Math.PI*2);
            ctx.fillStyle = '#bbbbbb';
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = "9px sans-serif";
            ctx.fillText(little.state === 'runningAway' ? "🏃" : "👶", little.x - 5, little.y + 3);
        }
    });

    angels.forEach(angel => {
        if (useImages && sprites.angel) {
            ctx.drawImage(sprites.angel, angel.x - angel.radius, angel.y - angel.radius, angel.radius*2, angel.radius*2);
        } else {
            ctx.beginPath();
            ctx.arc(angel.x, angel.y, angel.radius, 0, Math.PI*2);
            ctx.fillStyle = '#888888'; 
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.font = "12px sans-serif";
            ctx.fillText(angel.state === 'fleeing' ? "🙈" : "🗿", angel.x - 6, angel.y + 4);
        }
    });
}

function loop() {
    update();
    render();
    document.getElementById('scoreVal').innerText = player.score;
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
