<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Stats: Your Perspective</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
            --text-light: #f4f4f4;
            --accent: #ff4757;
            --muted: #777;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- SCREEN TOGGLING --- */
        #generator-screen { display: block; width: 100%; max-width: 550px; padding: 20px; }
        #display-screen { display: none; flex-direction: column; align-items: center; padding: 20px; width: 100%; }

        .survey-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #333;
        }

        .intro-header {
            text-align: center;
            border-bottom: 2px solid #eee;
            margin-bottom: 25px;
            padding-bottom: 15px;
        }

        .intro-header h2 { color: var(--dark); margin-bottom: 5px; }
        .intro-header p {
            font-size: 0.9em;
            color: var(--muted);
            line-height: 1.4;
            font-style: italic;
        }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-weight: 800; margin-bottom: 8px; color: #222; text-transform: uppercase; font-size: 0.85em; }
        .input-group input[type="text"], .input-group input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }

        /* --- STAT BLOCKS --- */
        .stat-block {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid var(--gold);
        }
        
        .stat-title {
            display: block;
            font-weight: 800;
            color: #1a1a1a;
            font-size: 1em;
            margin-bottom: 4px;
        }

        .stat-definition {
            display: block;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        input[type="range"] { 
            width: 100%; 
            accent-color: var(--accent); 
            cursor: pointer;
            height: 25px;
        }

        .main-btn {
            width: 100%; padding: 20px; border: none; border-radius: 12px; 
            font-weight: 900; font-size: 1.2em; cursor: pointer; margin-top: 20px;
            background: var(--dark); color: var(--gold);
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* --- THE CARD --- */
        .perspective { perspective: 1500px; width: 100%; max-width: 360px; height: 620px; }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border: 6px solid var(--gold);
            border-radius: 25px; background: var(--dark); overflow: hidden;
            display: flex; flex-direction: column; color: var(--text-light);
        }

        .card-back { transform: rotateY(180deg); }
        .header { background: var(--gold); color: black; text-align: center; padding: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
        .photo-area { width: 100%; height: 250px; background: #222; background-size: cover; background-position: center; border-bottom: 4px solid var(--gold); }
        .stats-content { padding: 15px; flex-grow: 1; overflow-y: auto; }

        .sec-title { color: var(--gold); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #444; margin: 15px 0 8px 0; letter-spacing: 1px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
        .stat-bar-bg { background: #333; height: 6px; border-radius: 3px; margin-bottom: 8px; }
        .stat-bar-fill { height: 100%; background: var(--gold); border-radius: 3px; }
        .def-small { font-size: 9px; color: #aaa; font-style: italic; margin-bottom: 2px; display: block; line-height: 1.2; }

        .action-bar { display: flex; gap: 10px; margin-top: 25px; width: 100%; max-width: 360px; }
        .sec-btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .dl-btn { background: var(--gold); color: black; }
        .edit-btn { background: #444; color: white; }
    </style>
</head>
<body>

<div id="generator-screen">
    <div class="survey-card">
        <div class="intro-header">
            <h2>Love Stats Measurement</h2>
            <p>These stats measure <b>your</b> personal feelings and connection toward this person.</p>
        </div>
        
        <div class="input-group">
            <label>1. Identity & Photo</label>
            <input type="file" id="photoIn" accept="image/*" onchange="handlePhoto(this)" style="margin-bottom:10px;">
            <input type="text" id="nameIn" placeholder="Enter Person's Name...">
        </div>

        <div id="sliders-container"></div>

        <button class="main-btn" onclick="generateAndShow()">Finalize My Stats</button>
    </div>
</div>

<div id="display-screen">
    <div class="perspective">
        <div class="card-inner" id="card" onclick="this.classList.toggle('is-flipped')">
            <!-- FRONT -->
            <div class="card-face card-front" id="capture-front">
                <div class="header" id="out-name-front">NAME</div>
                <div class="photo-area" id="out-photo"></div>
                <div class="stats-content" id="front-stats-box"></div>
                <div style="text-align:center; padding:10px; font-size:10px; color:var(--gold);">TAP TO FLIP ➔</div>
            </div>
            <!-- BACK -->
            <div class="card-face card-back">
                <div class="header" id="out-name-back">NAME</div>
                <div class="stats-content" id="back-stats-box"></div>
                <div style="text-align:center; padding:10px; font-size:10px; color:var(--gold);">⬅ TAP TO FLIP</div>
            </div>
        </div>
    </div>
    <div class="action-bar">
        <button class="sec-btn edit-btn" onclick="goBack()">RE-MEASURE</button>
        <button class="sec-btn dl-btn" onclick="download()">SAVE IMAGE</button>
    </div>
</div>

<script>
    const schema = [
        { title: "The Foundation", stats: [
            { id: "tru", n: "Trust", q: "How much do you trust them?", d: "The belief that they are reliable and have your best interests at heart." },
            { id: "loy", n: "Loyalty", q: "How loyal do you feel they are to you?", d: "The commitment to stay supportive through highs and lows." },
            { id: "res", n: "Respect", q: "How much do you respect them?", d: "Valuing their opinions, boundaries, and individuality." },
            { id: "com", n: "Communication", q: "How well do you communicate together?", d: "Sharing thoughts and listening without judgment." },
            { id: "hon", n: "Honesty", q: "How honest do you feel they are with you?", d: "Transparency about feelings and intentions." }
        ]},
        { title: "Emotional Connection", stats: [
            { id: "emp", n: "Empathy", q: "How much empathy do you feel from them?", d: "The ability to understand and share your feelings." },
            { id: "vul", n: "Vulnerability", q: "How open can you be with them?", d: "Being willing to show your 'true self' without fear." },
            { id: "sup", n: "Supportiveness", q: "How supported do you feel by them?", d: "Being your cheerleader and a safe place to land." },
            { id: "pat", n: "Patience", q: "How much patience do they show you?", d: "Giving you the space to grow and make mistakes." },
            { id: "kin", n: "Kindness", q: "How much kindness do you feel from them?", d: "Small daily acts of compassion and consideration." }
        ]},
        { title: "The Spark", stats: [
            { id: "phy", n: "Physical Attraction", q: "How much attraction do you feel?", d: "The pull toward their physical presence." },
            { id: "int", n: "Intimacy", q: "How deep is your intimacy?", d: "A deep emotional closeness and 'knowing' of one another." },
            { id: "hum", n: "Shared Humor", q: "How much do you laugh together?", d: "Being able to laugh and not take life too seriously." }
        ]}
    ];

    const sliderBox = document.getElementById('sliders-container');
    schema.forEach(sec => {
        sliderBox.innerHTML += `<h3 style="color:var(--accent); font-size:0.9em; text-transform:uppercase; margin-top:30px;">${sec.title}</h3>`;
        sec.stats.forEach(s => {
            sliderBox.innerHTML += `
                <div class="stat-block">
                    <span class="stat-title">${s.q}</span>
                    <span class="stat-definition">${s.d}</span>
                    <input type="range" id="in-${s.id}" min="1" max="10" value="5">
                </div>`;
        });
    });

    function handlePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('out-photo').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function generateAndShow() {
        const name = document.getElementById('nameIn').value || "THE SUBJECT";
        document.getElementById('out-name-front').innerText = name;
        document.getElementById('out-name-back').innerText = name;

        let frontHtml = `<div class="sec-title">The Foundation</div>`;
        let backHtml = "";

        schema.forEach((sec, idx) => {
            let html = (idx > 0) ? `<div class="sec-title">${sec.title}</div>` : "";
            sec.stats.forEach(s => {
                const val = document.getElementById(`in-${s.id}`).value;
                html += `
                    <div class="stat-row"><span>${s.n}</span><span>${val}/10</span></div>
                    <span class="def-small">${s.d}</span>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${val*10}%"></div></div>`;
            });
            if(idx === 0) frontHtml += html; else backHtml += html;
        });

        document.getElementById('front-stats-box').innerHTML = frontHtml;
        document.getElementById('back-stats-box').innerHTML = backHtml;

        document.getElementById('generator-screen').style.display = 'none';
        document.getElementById('display-screen').style.display = 'flex';
        window.scrollTo(0, 0);
    }

    function goBack() {
        document.getElementById('generator-screen').style.display = 'block';
        document.getElementById('display-screen').style.display = 'none';
    }

    function download() {
        html2canvas(document.getElementById('capture-front'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'MyLoveStats.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
