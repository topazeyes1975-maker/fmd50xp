<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XENO-DNA POWER TERMINAL</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: #0b1329;
      --primary: #00f0ff;
      --secondary: #7000ff;
      --accent: #ff0055;
      --text: #e2e8f0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .terminal-container {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 30px;
      max-width: 680px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .terminal-header {
      text-align: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      letter-spacing: 3px;
      margin: 0 0 5px 0;
      text-shadow: 0 0 10px var(--primary);
    }

    .subtitle {
      color: var(--secondary);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .input-grid {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.75rem;
      color: var(--primary);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    input {
      background: #020617;
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
      transition: all 0.2s ease;
    }

    button:hover {
      background: #8b24ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .status-panel {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      display: none;
    }

    .output-panel {
      margin-top: 25px;
      display: none;
    }

    .power-card {
      background: #020617;
      border-left: 4px solid var(--primary);
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 0 6px 6px 0;
    }

    .power-card.rule6 {
      border-left-color: var(--accent);
      background: #18020c;
    }

    .power-tag {
      font-size: 0.7rem;
      color: #64748b;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .power-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 6px;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
    }

    .power-card.rule6 .power-title {
      color: var(--accent);
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.3);
    }

    .power-desc {
      font-size: 0.9rem;
      line-height: 1.4;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <h1>XENO-DNA TERMINAL</h1>
      <div class="subtitle">AUTOMATED ALIEN POWER ENGINE v6.0</div>
    </div>

    <div class="input-grid">
      <div class="field-group">
        <label for="first">FIRST NAME</label>
        <input type="text" id="first" placeholder="Fonda" autocomplete="off">
      </div>
      <div class="field-group">
        <label for="middle">MIDDLE NAME</label>
        <input type="text" id="middle" placeholder="Marie" autocomplete="off">
      </div>
      <div class="field-group">
        <label for="last">LAST NAME</label>
        <input type="text" id="last" placeholder="Dutton" autocomplete="off">
      </div>
    </div>

    <button onclick="runPowerEngine()">SCAN DNA &amp; EXTRACT POWERS</button>

    <div id="status" class="status-panel"></div>
    <div id="output" class="output-panel"></div>
  </div>

  <script>
    // Lexical Matrix mapping letters to specific 3-part positional words
    // Slot 1: Action/Type | Slot 2: Domain/Subject | Slot 3: Delivery/Mechanic
    const lexicon = {
      'A': { w1: 'Acoustic', w2: 'Atmospheric', w3: 'Amplification' },
      'B': { w1: 'Barometric', w2: 'Bio-Electric', w3: 'Binding' },
      'C': { w1: 'Chronological', w2: 'Crystalline', w3: 'Conduction' },
      'D': { w1: 'Dimensional', w2: 'Density', w3: 'Download' },
      'E': { w1: 'Elemental', w2: 'Electromagnetic', w3: 'Extraction' },
      'F': { w1: 'Frequency', w2: 'Forcefield', w3: 'Fusion' },
      'G': { w1: 'Gravitational', w2: 'Genomic', w3: 'Grid' },
      'H': { w1: 'Harmonic', w2: 'Hyper-Spatial', w3: 'Harnessing' },
      'I': { w1: 'Inertial', w2: 'Ionized', w3: 'Induction' },
      'J': { w1: 'Junction', w2: 'Jet-Stream', w3: 'Jamming' },
      'K': { w1: 'Kinetic', w2: 'Kinship', w3: 'Keying' },
      'L': { w1: 'Luminous', w2: 'Lattice', w3: 'Levitation' },
      'M': { w1: 'Molecular', w2: 'Memory', w3: 'Modulation' },
      'N': { w1: 'Neural', w2: 'Nanite', w3: 'Navigation' },
      'O': { w1: 'Oscillating', w2: 'Organic', w3: 'Overdrive' },
      'P': { w1: 'Photonic', w2: 'Psychic', w3: 'Projection' },
      'Q': { w1: 'Quantum', w2: 'Quark', w3: 'Quenching' },
      'R': { w1: 'Resonant', w2: 'Reflective', w3: 'Redirect' },
      'S': { w1: 'Sonic', w2: 'Spatial', w3: 'Suppression' },
      'T': { w1: 'Temporal', w2: 'Telepathic', w3: 'Transmission' },
      'U': { w1: 'Ultra-Violet', w2: 'Universal', w3: 'Unification' },
      'V': { w1: 'Vector', w2: 'Volumetric', w3: 'Vaporization' },
      'W': { w1: 'Wave-Form', w2: 'Warp-Field', w3: 'Weaving' },
      'X': { w1: 'Xenon', w2: 'X-Ray', w3: 'Extraction' },
      'Y': { w1: 'Yielding', w2: 'Yotta-Watt', w3: 'Yoking' },
      'Z': { w1: 'Zero-Point', w2: 'Zonal', w3: 'Zip-Locking' }
    };

    // Known dictionary fallback definitions for instant lookup
    const localWordDb = {
      "SAT": "To force down or settle into a physical seated position.",
      "SAD": "To project an empathic mood suppression field that lowers enemy combat drive.",
      "DAD": "To establish an authoritative paternal command aura and protective bio-shield.",
      "MRS": "To shift physical gender states while altering structural muscle density."
    };

    async function runPowerEngine() {
      const first = document.getElementById('first').value.trim();
      const middle = document.getElementById('middle').value.trim();
      const last = document.getElementById('last').value.trim();

      if (!first || !last) {
        alert("TERMINAL ERROR: First and Last Name are required.");
        return;
      }

      const statusDiv = document.getElementById('status');
      const outputDiv = document.getElementById('output');
      
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = "SCANNING GENOMIC MATRIX &amp; QUERYING LEXICAL DATABASES...";
      outputDiv.style.display = 'none';
      outputDiv.innerHTML = '';

      const fI = first.charAt(0).toUpperCase();
      const mI = middle ? middle.charAt(0).toUpperCase() : '';
      const lI = last.charAt(0).toUpperCase();

      const initialsWord = `${fI}${mI}${lI}`;
      let powers = [];

      // --- RULE 6: WORD SYNTHESIS CHECK (Live API Query + Fallback) ---
      if (initialsWord.length === 3) {
        let wordDefinition = localWordDb[initialsWord] || null;

        if (!wordDefinition) {
          try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${initialsWord.toLowerCase()}`);
            if (res.ok) {
              const data = await res.json();
              wordDefinition = data[0].meanings[0].definitions[0].definition;
            }
          } catch (e) {
            console.log("Dictionary API query skipped or offline.");
          }
        }

        if (wordDefinition) {
          powers.push({
            rule: "RULE 6: WORD SYNTHESIS OVERRIDE",
            isRule6: true,
            title: `SYNTHESIS: ${initialsWord.toUpperCase()} INNATE ABILITY`,
            desc: `The DNA initials spell an active concept word. Ability derived directly from the meaning: "${wordDefinition}"`
          });
        }
      }

      // --- RULE 1: ALL-INITIAL 3-WORD FUSED POWER ---
      const w1 = lexicon[fI] ? lexicon[fI].w1 : "Force";
      const w2 = mI && lexicon[mI] ? lexicon[mI].w2 : (lexicon[fI] ? lexicon[fI].w2 : "Energy");
      const w3 = lexicon[lI] ? lexicon[lI].w3 : "Displacement";

      powers.push({
        rule: "RULE 1: 3-INITIAL CONCEPT FUSION",
        title: `${w1} ${w2} ${w3}`,
        desc: `A single, unified ability where ${w1.toLowerCase()} energy and ${w2.toLowerCase()} fields fuse directly into ${w3.toLowerCase()}.`
      });

      // --- RULE 2: DUAL-PREFIX + DOMAIN FUSION ---
      const prefix = `${fI}${mI}`;
      let prefixConcept = "Acoustic Signal";
      if (prefix === "FM") prefixConcept = "Frequency Modulation Radio Wave";
      else if (prefix === "DJ") prefixConcept = "Sonic Stream";
      else if (prefix === "CL") prefixConcept = "Crystalline Lattice";

      const domainConcept = lexicon[lI] ? lexicon[lI].w1 : "Vector";
      powers.push({
        rule: "RULE 2: DUAL-PREFIX + DOMAIN FUSION",
        title: `${prefixConcept} ${domainConcept} Tuning`,
        desc: `Fuses ${prefixConcept} manipulation with the broader ${domainConcept.toLowerCase()} domain into a single tactical field.`
      });

      // --- RULE 3: COUNT-INITIAL HYBRID ---
      const firstLen = first.length;
      const tierDomain = lexicon[lI] ? lexicon[lI].w1 : "Spatial";
      powers.push({
        rule: "RULE 3: COUNT-INITIAL HYBRID",
        title: `Tier-${firstLen} ${tierDomain} Scale`,
        desc: `First name length (${firstLen}) dictates a Tier-${firstLen} scale of innate output, bound to the ${tierDomain.toLowerCase()} domain.`
      });

      // --- RULE 4: MULTI-NAME MATH CAPACITY ---
      const totalCount = firstLen + (middle ? middle.length : 0) + last.length;
      powers.push({
        rule: "RULE 4: TOTAL GENOMIC CAPACITY",
        title: `${totalCount}00-Megawatt Core Capacity`,
        desc: `Combined genomic length (${totalCount}) dictates maximum energy reserves for sustained power usage.`
      });

      // --- RULE 5: POSITIONAL FUSION ---
      let midChar = middle ? middle.charAt(Math.floor(middle.length / 2)).toUpperCase() : fI;
      const p1 = lexicon[fI] ? lexicon[fI].w1 : "Vector";
      const p2 = lexicon[midChar] ? lexicon[midChar].w2 : "Matrix";
      const p3 = lexicon[lI] ? lexicon[lI].w3 : "Shift";
      powers.push({
        rule: "RULE 5: POSITIONAL FUSION ENGINE",
        title: `${p1} ${p2} ${p3}`,
        desc: `Extracted positional letters (${fI}-${midChar}-${lI}) fuse into a specialized auxiliary ability.`
      });

      // Render Results
      statusDiv.style.display = 'none';
      outputDiv.style.display = 'block';

      powers.forEach(p => {
        outputDiv.innerHTML += `
          <div class="power-card ${p.isRule6 ? 'rule6' : ''}">
            <div class="power-tag">${p.rule}</div>
            <div class="power-title">${p.title}</div>
            <div class="power-desc">${p.desc}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
