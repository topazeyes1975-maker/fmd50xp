<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master AI Prompt Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { max-width: 750px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .full-width { grid-column: span 2; }
    label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 600; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; }
    button { grid-column: span 2; margin-top: 15px; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; margin-top: 10px; }
    .btn-secondary:hover { background: #475569; }
    .output { margin-top: 20px; padding: 15px; background: #090d16; border-left: 4px solid #3b82f6; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
    .hidden { display: none; }
    .dynamic-group { background: #111827; padding: 14px; border-radius: 8px; border: 1px solid #374151; margin-top: 12px; }
    .char-preview-thumb { max-height: 80px; border-radius: 4px; margin-top: 8px; border: 1px solid #475569; display: block; }
    .sub-label { font-size: 0.75rem; color: #cbd5e1; font-weight: normal; margin-top: 6px; display: block; }
  </style>
</head>
<body>

<div class="card">
  <h2>Master AI Prompt Generator</h2>
  
  <label for="category">Select Creative Mode</label>
  <select id="category" onchange="renderFields()">
    <option value="cinema">1. Cinema / Video / Animation</option>
    <option value="music">2. Music / Songwriting / Audio</option>
    <option value="business">3. Business / Writing / Marketing</option>
  </select>

  <div id="dynamic-form" class="grid"></div>

  <button onclick="buildPrompt()">Generate Master Prompt</button>
  <button class="btn-secondary" onclick="copyPrompt()">Copy to Clipboard</button>

  <div id="output-box" class="output">Your detailed prompt will assemble here...</div>
</div>

<script>
function checkCustom(selectId, inputId) {
  const sel = document.getElementById(selectId);
  const inp = document.getElementById(inputId);
  if (sel && sel.value === 'OTHER') {
    inp.classList.remove('hidden');
  } else if (inp) {
    inp.classList.add('hidden');
  }
}

// Preview uploaded image file for character
function handleImagePreview(input, imgId, nameContainerId) {
  const file = input.files[0];
  const imgTag = document.getElementById(imgId);
  const nameTag = document.getElementById(nameContainerId);
  
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      imgTag.src = e.target.result;
      imgTag.classList.remove('hidden');
    };
    reader.readAsDataURL(file);
    nameTag.value = `Reference Image: [${file.name}]`;
  }
}

// Generate dynamic inputs for characters with Image & Description support
function updateCharacterInputs() {
  const count = parseInt(document.getElementById('charCount').value, 10);
  const container = document.getElementById('character-fields-container');
  container.innerHTML = '';
  
  for (let i = 1; i <= count; i++) {
    container.innerHTML += `
      <div class="dynamic-group">
        <label style="color: #60a5fa;">Character ${i} Identity & Action</label>
        
        <span class="sub-label">Option A: Upload Reference Image</span>
        <input type="file" accept="image/*" onchange="handleImagePreview(this, 'preview-${i}', 'img-ref-name-${i}')" style="font-size: 0.8rem; padding: 6px;">
        <input type="hidden" id="img-ref-name-${i}" value="">
        <img id="preview-${i}" class="char-preview-thumb hidden" alt="Character ${i} Preview">

        <span class="sub-label">Option B: Visual Description (Appearance, Clothing, Features)</span>
        <input type="text" class="char-desc" placeholder="e.g., Cyberpunk detective in a brown leather trench coat with glowing blue cybernetic eyes">

        <span class="sub-label">Character Action in Scene</span>
        <input type="text" class="char-action" placeholder="e.g., Drawing a chrome pistol while crouching behind cover">
      </div>
    `;
  }
}

// Generate dynamic inputs for objects
function updateObjectInputs() {
  const count = parseInt(document.getElementById('objCount').value, 10);
  const container = document.getElementById('object-fields-container');
  container.innerHTML = '';
  
  for (let i = 1; i <= count; i++) {
    container.innerHTML += `
      <div class="dynamic-group">
        <label style="color: #f59e0b;">Key Object ${i}</label>
        <input type="text" class="obj-input" placeholder="e.g., A rusty vintage car idling under a broken streetlamp">
      </div>
    `;
  }
}

function renderFields() {
  const cat = document.getElementById('category').value;
  const form = document.getElementById('dynamic-form');
  
  if (cat === 'cinema') {
    form.innerHTML = `
      <div class="full-width">
        <label>Primary Setting / Location</label>
        <input type="text" id="setting" placeholder="e.g., A foggy alleyway outside a futuristic nightclub">
      </div>

      <!-- Character Counter -->
      <div>
        <label>Number of Characters</label>
        <select id="charCount" onchange="updateCharacterInputs()">
          <option value="1">1 Character</option>
          <option value="2">2 Characters</option>
          <option value="3">3 Characters</option>
          <option value="4">4 Characters</option>
        </select>
      </div>

      <!-- Object Counter -->
      <div>
        <label>Number of Key Objects</label>
        <select id="objCount" onchange="updateObjectInputs()">
          <option value="0">0 Key Objects</option>
          <option value="1">1 Key Object</option>
          <option value="2">2 Key Objects</option>
          <option value="3">3 Key Objects</option>
        </select>
      </div>

      <div id="character-fields-container" class="full-width"></div>
      <div id="object-fields-container" class="full-width"></div>

      <div>
        <label>Time of Day (Lighting Mood)</label>
        <select id="timeOfDay">
          <option value="high zenith noon sunlight with crisp bright atmosphere">High Noon (Direct Overhead)</option>
          <option value="warm golden hour sunset lighting with long soft shadows">Golden Hour / Sunset</option>
          <option value="cool soft dawn morning light with gentle haze">Early Morning / Dawn</option>
          <option value="dark moody night lit by soft moonlight and ambient shadows">Night / Midnight</option>
          <option value="dramatic neon glow and moody artificial streetlights">Night (City / Artificial Lights)</option>
        </select>
      </div>
      <div>
        <label>Light Source Direction</label>
        <select id="lightDirection">
          <option value="positioned directly overhead">Directly Overhead</option>
          <option value="casting from the far left of the frame">From the Left</option>
          <option value="casting from the far right of the frame">From the Right</option>
          <option value="backlit from behind the subject creating a strong silhouette/rim light">Behind Subject (Backlit / Silhouette)</option>
          <option value="angled at a 45-degree side angle">Off-Center Side Light (45 Degrees)</option>
        </select>
      </div>
      <div class="full-width">
        <label>Atmosphere & Weather (Optional)</label>
        <input type="text" id="weather" placeholder="e.g., Heavy fog, light rain, drifting steam">
      </div>
      <div class="full-width">
        <label>Visual Style Presets</label>
        <select id="styleSelect" onchange="checkCustom('styleSelect', 'customStyle')">
          <option value="Vintage 35mm film grain, cinematic anamorphic look">Vintage 35mm Film</option>
          <option value="Gritty Cyberpunk Neon Noir style, teal and magenta grade">Cyberpunk Neon Noir</option>
          <option value="Dark Fantasy cinematic aesthetic, moody volumetric mist">Dark Fantasy</option>
          <option value="3D Stylized Animation aesthetic, vibrant lighting">3D Animated / Pixar Style</option>
          <option value="OTHER">Other / Custom Style...</option>
        </select>
        <input type="text" id="customStyle" class="hidden" placeholder="Type your own custom visual style here..." style="margin-top: 8px;">
      </div>
    `;
    
    updateCharacterInputs();
    updateObjectInputs();

  } else if (cat === 'music') {
    form.innerHTML = `
      <div class="full-width">
        <label>Song Topic & Concept</label>
        <input type="text" id="field1" placeholder="e.g., Driving through city streets late at night">
      </div>
      <div>
        <label>Musical Genre</label>
        <select id="styleSelect" onchange="checkCustom('styleSelect', 'customStyle')">
          <option value="80s Synthwave / Retrowave">80s Synthwave / Retrowave</option>
          <option value="Cinematic Orchestral & Epic Strings">Cinematic Orchestral</option>
          <option value="Lo-Fi Hip-Hop / Chill Beats">Lo-Fi Hip-Hop / Chill</option>
          <option value="Acoustic Folk / Indie Singer-Songwriter">Acoustic Folk / Indie</option>
          <option value="OTHER">Other / Custom Genre...</option>
        </select>
        <input type="text" id="customStyle" class="hidden" placeholder="Type your own custom genre here..." style="margin-top: 8px;">
      </div>
      <div>
        <label>Key Instruments</label>
        <input type="text" id="field3" placeholder="e.g., Analog synths, deep bass, electric drums">
      </div>
      <div class="full-width">
        <label>Vocal & Pacing Style</label>
        <input type="text" id="field4" placeholder="e.g., Mid-tempo (100 BPM), soft reverb-heavy female vocals">
      </div>
    `;
  } else if (cat === 'business') {
    form.innerHTML = `
      <div class="full-width">
        <label>Core Topic / Story Plot / Goal</label>
        <input type="text" id="field1" placeholder="e.g., Launching a new tool OR Chapter outline for a sci-fi book">
      </div>
      <div>
        <label>Content Format</label>
        <select id="field2">
          <option value="Story Plot & Narrative Outline">Story Plot & Narrative Outline</option>
          <option value="Marketing Copy & Product Pitch">Marketing Copy & Product Pitch</option>
          <option value="Meeting Agenda & Editorial Summary">Meeting Agenda & Editorial Summary</option>
        </select>
      </div>
      <div>
        <label>Target Audience</label>
        <input type="text" id="field3" placeholder="e.g., Sci-fi readers, busy parents, corporate clients">
      </div>
      <div class="full-width">
        <label>Tone of Voice</label>
        <select id="styleSelect" onchange="checkCustom('styleSelect', 'customStyle')">
          <option value="Persuasive, authoritative, and highly professional">Professional & Authoritative</option>
          <option value="Casual, friendly, and conversational">Casual & Conversational</option>
          <option value="Punchy, direct, and sales-focused">Punchy & Direct (Sales Pitch)</option>
          <option value="Suspenseful, vivid, and story-driven">Suspenseful & Narrative (Storytelling)</option>
          <option value="OTHER">Other / Custom Tone...</option>
        </select>
        <input type="text" id="customStyle" class="hidden" placeholder="Type your own custom tone of voice here..." style="margin-top: 8px;">
      </div>
    `;
  }
}

function buildPrompt() {
  const cat = document.getElementById('category').value;
  const selStyle = document.getElementById('styleSelect')?.value;
  const customVal = document.getElementById('customStyle')?.value;
  const activeStyle = (selStyle === 'OTHER' && customVal) ? customVal : selStyle;

  let result = '';

  if (cat === 'cinema') {
    const setting = document.getElementById('setting')?.value || 'A detailed scene';
    const time = document.getElementById('timeOfDay').value;
    const dir = document.getElementById('lightDirection').value;
    const weather = document.getElementById('weather')?.value;
    
    // Collect Characters (Image/Description + Action)
    const descs = document.querySelectorAll('.char-desc');
    const actions = document.querySelectorAll('.char-action');
    let charList = [];

    descs.forEach((descInput, idx) => {
      const imgRefVal = document.getElementById(`img-ref-name-${idx + 1}`)?.value;
      const descVal = descInput.value.trim();
      const actionVal = actions[idx]?.value.trim();

      let charIdentity = '';
      if (imgRefVal && descVal) {
        charIdentity = `${descVal} (${imgRefVal})`;
      } else if (imgRefVal) {
        charIdentity = imgRefVal;
      } else if (descVal) {
        charIdentity = descVal;
      } else {
        charIdentity = `Character ${idx + 1}`;
      }

      let charEntry = `Character ${idx + 1} [Identity: ${charIdentity}]`;
      if (actionVal) {
        charEntry += ` -> Action: ${actionVal}`;
      }
      charList.push(charEntry);
    });

    // Collect Objects
    const objInputs = document.querySelectorAll('.obj-input');
    let objList = [];
    objInputs.forEach((input, idx) => {
      if (input.value.trim() !== '') {
        objList.push(`Key Object ${idx + 1}: ${input.value.trim()}`);
      }
    });

    let lightingText = `Lit by ${time}, with light source ${dir}`;
    if (weather) {
      lightingText += `, filtered through ${weather}`;
    }

    // Assemble Prompt
    result = `Cinematic shot set in ${setting}.\n`;
    
    if (charList.length > 0) {
      result += `\nCharacter Details & Actions:\n- ${charList.join('\n- ')}\n`;
    }
    
    if (objList.length > 0) {
      result += `\nKey Scene Objects:\n- ${objList.join('\n- ')}\n`;
    }

    result += `\nLighting & Environment: ${lightingText}.\nRendered in ${activeStyle}. High visual detail, photorealistic atmosphere, coherent composition.`;

  } else if (cat === 'music') {
    const f1 = document.getElementById('field1')?.value || 'N/A';
    const f3 = document.getElementById('field3')?.value || 'N/A';
    const f4 = document.getElementById('field4')?.value || 'N/A';
    result = `Create a ${activeStyle} track centered on the theme: "${f1}". Primary instrumentation includes ${f3}. Vocal/Pacing style: ${f4}. Focus on strong dynamic structure and clean production mix.`;
  } else if (cat === 'business') {
    const f1 = document.getElementById('field1')?.value || 'N/A';
    const f2 = document.getElementById('field2')?.value || 'N/A';
    const f3 = document.getElementById('field3')?.value || 'N/A';
    result = `Act as an expert author and strategist. Develop a comprehensive ${f2} focused on: "${f1}". Target audience: ${f3}. Tone of voice: ${activeStyle}. Organize the output into clear, actionable sections with detailed key points.`;
  }

  document.getElementById('output-box').innerText = result;
}

function copyPrompt() {
  const text = document.getElementById('output-box').innerText;
  navigator.clipboard.writeText(text);
  alert('Prompt copied to clipboard!');
}

// Initial Render
renderFields();
</script>

</body>
</html>
