<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armored Snail Warrior - Building Escape</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; pointer-events: none; z-index: 10; }
        .joystick { position: absolute; bottom: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        #left-stick { left: 30px; }
        #right-stick { right: 30px; }
        .stick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Objective: Find the Baby in the Building<br>Score: <span id="score">0</span> | Health: <span id="health">100</span></div>
    <div id="left-stick" class="joystick"><div id="left-knob" class="stick-knob"></div></div>
    <div id="right-stick" class="joystick"><div id="right-knob" class="stick-knob"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0f1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Building Floor Grid
        const gridHelper = new THREE.GridHelper(50, 50, 0x00ffcc, 0x333333);
        scene.add(gridHelper);

        // Snail Character Group (Holds body + spinning energy shell)
        const snailGroup = new THREE.Group();
        scene.add(snailGroup);

        // Snail Body (Placeholder box until .glb is loaded)
        const bodyGeo = new THREE.BoxGeometry(1, 1, 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5555ff });
        const snailBody = new THREE.Mesh(bodyGeo, bodyMat);
        snailBody.position.y = 0.5;
        snailGroup.add(snailBody);

        // Spinning Energy Shell (The glowing ring around the snail!)
        const ringGeo = new THREE.TorusGeometry(1.8, 0.08, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, wireframe: true });
        const energyShell = new THREE.Mesh(ringGeo, ringMat);
        energyShell.rotation.x = Math.PI / 2;
        energyShell.position.y = 0.5;
        snailGroup.add(energyShell);

        // Joystick Input States
        let moveX = 0, moveZ = 0;
        let score = 0;

        function setupJoystick(stickId, knobId, callback) {
            const stick = document.getElementById(stickId);
            const knob = document.getElementById(knobId);
            const maxDist = 35;
            let activeTouchId = null;

            stick.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                updateStick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        updateStick(e.changedTouches[i]);
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        activeTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        callback(0, 0);
                    }
                }
            });

            function updateStick(touch) {
                const r = stick.getBoundingClientRect();
                let x = touch.clientX - r.left - (r.width / 2);
                let y = touch.clientY - r.top - (r.height / 2);
                const dist = Math.sqrt(x * x + y * y);
                if (dist > maxDist) {
                    x = (x / dist) * maxDist;
                    y = (y / dist) * maxDist;
                }
                knob.style.transform = `translate(${x}px, ${y}px)`;
                callback(x / maxDist, y / maxDist);
            }
        }

        setupJoystick('left-stick', 'left-knob', (x, y) => {
            moveX = x;
            moveZ = y;
        });

        setupJoystick('right-stick', 'right-knob', (x, y) => {
            // Right stick action triggers the attack / sword swing pulse
            if (Math.abs(x) > 0.4 || Math.abs(y) > 0.4) {
                energyShell.scale.set(1.3, 1.3, 1.3); // Pulse shell on attack
                score += 5;
                document.getElementById('score').innerText = score;
            } else {
                energyShell.scale.set(1, 1, 1);
            }
        });

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move Snail Group
            snailGroup.position.x += moveX * 0.1;
            snailGroup.position.z += moveZ * 0.1;

            // Rotate toward movement direction
            if (moveX !== 0 || moveZ !== 0) {
                snailGroup.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Continuously spin the energy shell for that cool sci-fi effect!
            energyShell.rotation.z += 0.05;

            // Camera tracks the snail inside the building
            camera.position.x = snailGroup.position.x;
            camera.position.z = snailGroup.position.z + 12;
            camera.lookAt(snailGroup.position.x, snailGroup.position.y, snailGroup.position.z);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
