<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher Codec</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; width: 60px; height: 60px; touch-action: none; }
        .controls { margin-top: 30px; border-top: 2px solid #7c4dff; padding-top: 20px; }
        #messageVisualizer { margin-top: 20px; padding: 10px; border: 2px solid #7c4dff; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save to Cloud</button>
        <button onclick="loadAll()">Load from Cloud</button>
        
        <hr>
        <h3>Message Visualizer</h3>
        <input type="text" id="messageInput" placeholder="Type word...">
        <button onclick="visualizeWord()">Generate Visual Key</button>
        <div id="messageVisualizer"></div>
    </div>

    <script>
        const supabaseUrl = 'https://jhgcyiswxubqzqtbhain.supabase.co'; 
        const supabaseKey = 'sb_publishable_0j0PaDVT_pXMJawcf2W8fQ_Lz9B4KoW'; 
        const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');
        let drawingPaths = {};

        function setupCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    let drawing = false;

    // Helper to get correct coordinates
    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        // Check if it's a touch event or mouse event
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    canvas.onmousedown = (e) => { 
        drawing = true; 
        ctx.beginPath(); 
        const {x, y} = getCoords(e);
        ctx.moveTo(x, y); 
    };

    canvas.onmousemove = (e) => { 
        if(drawing) { 
            const {x, y} = getCoords(e);
            ctx.lineTo(x, y); 
            ctx.stroke(); 
        } 
    };

    canvas.onmouseup = () => { drawing = false; };
    
    // Mobile Touch Support
    canvas.ontouchstart = (e) => { 
        drawing = true; 
        e.preventDefault(); 
        ctx.beginPath();
        const {x, y} = getCoords(e);
        ctx.moveTo(x, y);
    };

    canvas.ontouchmove = (e) => { 
        if(drawing) { 
            e.preventDefault();
            const {x, y} = getCoords(e);
            ctx.lineTo(x, y); 
            ctx.stroke(); 
        }
    };
    
    canvas.ontouchend = () => { drawing = false; };
}


        letters.forEach(letter => {
            container.innerHTML += `<div><p>${letter}</p><canvas id="canvas${letter}"></canvas></div>`;
        });
        
        letters.forEach(letter => {
            setupCanvas(document.getElementById('canvas' + letter));
        });

        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            // Simplified save: we grab current drawings from the canvases
            let currentData = {};
            letters.forEach(l => {
                const canvas = document.getElementById('canvas' + l);
                currentData[l] = canvas.toDataURL();
            });
            await mySupabase.from('codelock').upsert([{ Code: code, alphabet_data: currentData }]);
            alert("Saved!");
        }

        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data } = await mySupabase.from('codelock').select('alphabet_data').eq('Code', code).single();
            if (data) {
                letters.forEach(l => {
                    const canvas = document.getElementById('canvas'+l);
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => {
                        ctx.clearRect(0, 0, 60, 60);
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = data.alphabet_data[l];
                });
                alert("Loaded!");
            } else { alert("Code not found."); }
        }

        function visualizeWord() {
            const word = document.getElementById('messageInput').value.toUpperCase();
            const viz = document.getElementById('messageVisualizer');
            viz.innerHTML = "";
            
            const oldCanvas = document.getElementById('exportCanvas');
            if (oldCanvas) oldCanvas.remove();

            const boxSize = 60;
            const padding = 8; 
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.id = "exportCanvas";
            exportCanvas.width = word.length * boxSize; 
            exportCanvas.height = boxSize;
            const exportCtx = exportCanvas.getContext('2d');
            
            exportCtx.fillStyle = 'black'; 
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            
            let foundAny = false;
            let xPos = 0; 

            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                const sourceCanvas = document.getElementById('canvas' + char);
                
                if (sourceCanvas) {
                    foundAny = true;
                    
                    exportCtx.strokeStyle = '#ffffff';
                    exportCtx.lineWidth = 2;
                    exportCtx.strokeRect(xPos, 0, boxSize, boxSize);
                    
                    exportCtx.drawImage(
                        sourceCanvas, 
                        xPos + padding, padding, 
                        boxSize - (padding * 2), boxSize - (padding * 2)
                    );
                    
                    const displayCanvas = document.createElement('canvas');
                    displayCanvas.width = boxSize;
                    displayCanvas.height = boxSize;
                    const dCtx = displayCanvas.getContext('2d');
                    dCtx.fillStyle = 'black';
                    dCtx.fillRect(0, 0, boxSize, boxSize);
                    dCtx.strokeStyle = 'white';
                    dCtx.strokeRect(0, 0, boxSize, boxSize);
                    dCtx.drawImage(sourceCanvas, padding, padding, boxSize-(padding*2), boxSize-(padding*2));
                    viz.appendChild(displayCanvas);
                    
                    xPos += boxSize; 
                }
            }
            
            if (foundAny) {
                const btn = document.createElement('button');
                btn.innerText = "Download Visual Key";
                btn.onclick = downloadVisualKey;
                viz.appendChild(btn);
                document.body.appendChild(exportCanvas);
                exportCanvas.style.display = "none";
            } else {
                alert("Alphabet not loaded!");
            }
        }

        function downloadVisualKey() {
            const canvas = document.getElementById('exportCanvas');
            if (!canvas) return;

            let fileName = prompt("What would you like to name your secret key?", "my-cipher-key");
            if (fileName !== null) {
                if (!fileName.endsWith('.png')) fileName += '.png';
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL("image/png");
                link.click();
            }
        }
    </script>
</body>
</html>
