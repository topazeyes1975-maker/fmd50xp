<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; width: 60px; height: 60px; }
        .controls { margin-top: 30px; border-top: 2px solid #7c4dff; padding-top: 20px; }
        #messageVisualizer { margin-top: 20px; padding: 10px; border: 2px solid #7c4dff; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>Cipher Visualizer</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save Alphabet</button>
        <button onclick="loadAll()">Load Alphabet</button>
        
        <hr>
        <h3>Message Visualizer</h3>
        <input type="text" id="messageInput" placeholder="Type word...">
        <button onclick="visualizeWord()">Generate Visual Key</button>
        <div id="messageVisualizer"></div>
    </div>

    <script>
        const supabaseUrl = 'https://jhgcyiswxubqzqtbhain.supabase.co'; 
        const supabaseKey = 'sb_publishable_0j0PaDVT_pXMJawcf2W8fQ_Lz9B4KoW'; 
        const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');
        let drawingPaths = {};

        // Setup Alphabet
        letters.forEach(letter => {
            container.innerHTML += `<div><p>${letter}</p><canvas id="canvas${letter}"></canvas></div>`;
            drawingPaths[letter] = [];
        });

        // Simplified: Just draws a set of paths to a given context
        function drawPathsToCtx(ctx, paths) {
            ctx.clearRect(0, 0, 60, 60);
            ctx.beginPath();
            paths.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }

        // Database logic remains the same (Save/Load)
        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            await mySupabase.from('codelock').upsert([{ Code: code, alphabet_data: drawingPaths }]);
            alert("Alphabet Saved!");
        }

        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data } = await mySupabase.from('codelock').select('alphabet_data').eq('Code', code).single();
            if (data) {
                drawingPaths = data.alphabet_data;
                letters.forEach(l => {
                    const ctx = document.getElementById('canvas'+l).getContext('2d');
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
                    drawPathsToCtx(ctx, drawingPaths[l]);
                });
            }
        }

        // NEW: Visualizer
        function visualizeWord() {
            const word = document.getElementById('messageInput').value.toUpperCase();
            const viz = document.getElementById('messageVisualizer');
            viz.innerHTML = "";
            for (let char of word) {
                if (drawingPaths[char]) {
                    const canvas = document.createElement('canvas');
                    canvas.width = 60; canvas.height = 60;
                    const ctx = canvas.getContext('2d');
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
                    drawPathsToCtx(ctx, drawingPaths[char]);
                    viz.appendChild(canvas);
                }
            }
        }
    </script>
</body>
</html>
