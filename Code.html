<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Cipher Codec - Full Version</title>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .letter-box { text-align: center; }
        canvas { border: 2px solid #7c4dff; background: #2d1b4e; touch-action: none; cursor: crosshair; }
        .controls { position: sticky; bottom: 0; background: #1a0b2e; padding: 20px; border-top: 2px solid #7c4dff; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save All Symbols</button>
        <button onclick="loadAll()">Load Symbols</button>
    </div>
<hr>
<div class="controls">
    <h3>Translator</h3>
    <textarea id="messageInput" placeholder="Enter text to code or paste code to decode..."></textarea>
    <br>
    <button onclick="encodeMessage()">Encode to Symbols</button>
    <button onclick="decodeMessage()">Decode from Symbols</button>
    <p>Result:</p>
    <div id="resultArea" style="border: 1px solid #7c4dff; padding: 10px; min-height: 50px;"></div>
</div>

    <script>
    
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');

        // This loop creates the 26 boxes automatically
        letters.forEach(letter => {
            container.innerHTML += `
                <div class="letter-box">
                    <p>${letter}</p>
                    <canvas id="canvas${letter}" width="100" height="100"></canvas>
                </div>
            `;
        });

        // Drawing logic for each canvas
        letters.forEach(letter => {
            const canvas = document.getElementById('canvas' + letter);
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            let drawing = false;

            const draw = (e) => {
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            canvas.onmousedown = () => { drawing = true; ctx.beginPath(); };
            canvas.onmouseup = () => drawing = false;
            canvas.onmousemove = draw;
            canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); e.preventDefault(); };
            canvas.ontouchend = () => drawing = false;
            canvas.ontouchmove = (e) => { draw(e); e.preventDefault(); };
        });

        // The "Lock" logic: Saving all 26 canvases as one set
        function saveAll() {
            const code = document.getElementById('cipherCode').value;
            if (code.length !== 6) return alert("Enter 6 digits!");
            let cipherData = {};
            letters.forEach(l => cipherData[l] = document.getElementById('canvas' + l).toDataURL());
            localStorage.setItem('cipher_' + code, JSON.stringify(cipherData));
            alert("Alphabet saved under code: " + code);
        }

        // The "Unlock" logic: Bringing them all back
        function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const data = localStorage.getItem('cipher_' + code);
            if (!data) return alert("Code not found!");
            const cipherData = JSON.parse(data);
            letters.forEach(l => {
                const canvas = document.getElementById('canvas' + l);
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.src = cipherData[l];
                img.onload = () => { ctx.clearRect(0,0,100,100); ctx.drawImage(img, 0, 0); };
            });
        }// --- THE TRANSLATOR LOGIC ---

function encodeMessage() {
    const input = document.getElementById('messageInput').value.toUpperCase();
    let encodedResult = "";
    
    // For every letter, we grab the image data (your drawing)
    for (let char of input) {
        if (letters.includes(char)) {
            const canvas = document.getElementById('canvas' + char);
            encodedResult += `<img src="${canvas.toDataURL()}" width="30" height="30"> `;
        } else {
            encodedResult += " "; // Handle spaces
        }
    }
    document.getElementById('resultArea').innerHTML = encodedResult;
}
