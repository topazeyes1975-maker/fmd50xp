<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher Codec</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; cursor: crosshair; touch-action: none; width: 60px; height: 60px; }
        .controls { margin-top: 30px; border-top: 2px solid #7c4dff; padding-top: 20px; }
        textarea { resize: none; width: 100%; height: 60px; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save Alphabet</button>
        <button onclick="loadAll()">Load Alphabet</button>
        
        <hr>
        <h3>Message Transformer</h3>
        <textarea id="messageInput" placeholder="Type word to encode..."></textarea>
        <button onclick="encodeWord()">Encode Word</button>
        
        <textarea id="outputKey" placeholder="Copy/Paste your encoded drawing data here..."></textarea>
        <button onclick="decodeWord()">Decode Word</button>
        <div id="resultArea" style="margin-top:10px; border:1px solid #7c4dff; padding:10px; font-size: 20px;"></div>
    </div>

    <script>
        const supabaseUrl = 'https://jhgcyiswxubqzqtbhain.supabase.co'; 
        const supabaseKey = 'sb_publishable_0j0PaDVT_pXMJawcf2W8fQ_Lz9B4KoW'; 
        const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');
        let drawingPaths = {};

        // Setup Alphabet Canvases
        letters.forEach(letter => {
            container.innerHTML += `<div><p>${letter}</p><canvas id="canvas${letter}"></canvas></div>`;
            drawingPaths[letter] = [];
        });

        // Initialize drawing logic for alphabet
        letters.forEach(letter => {
            const canvas = document.getElementById('canvas' + letter);
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
            let drawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
            const end = () => drawing = false;
            const move = (e) => {
                if (!drawing) return;
                if (e.cancelable) e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y); ctx.stroke();
                drawingPaths[letter].push({x: pos.x, y: pos.y});
            };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mouseup', end);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('touchend', end);
            canvas.addEventListener('touchmove', move, {passive: false});
        });

        function decodeDrawing(letter, paths) {
            const canvas = document.getElementById('canvas' + letter);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            paths.forEach((p, index) => {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
        }

        // Database Functions
        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            const { error } = await mySupabase.from('codelock').upsert([{ Code: code, alphabet_data: drawingPaths }]);
            if (error) alert("Error: " + error.message); else alert("Alphabet Saved!");
        }

        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data } = await mySupabase.from('codelock').select('alphabet_data').eq('Code', code).single();
            if (data) {
                drawingPaths = data.alphabet_data;
                letters.forEach(l => { if (drawingPaths[l]) decodeDrawing(l, drawingPaths[l]); });
                alert("Alphabet Loaded!");
            } else { alert("Code not found."); }
        }

        // Encoder / Decoder
        function encodeWord() {
            const word = document.getElementById('messageInput').value.toUpperCase();
            let encodedData = [];
            for (let char of word) {
                if (drawingPaths[char]) {
                    encodedData.push({ letter: char, paths: drawingPaths[char] });
                }
            }
            document.getElementById('outputKey').value = JSON.stringify(encodedData);
        }

        function decodeWord() {
            const rawData = document.getElementById('outputKey').value;
            try {
                const encodedData = JSON.parse(rawData);
                let result = "";
                encodedData.forEach(item => { result += item.letter; });
                document.getElementById('resultArea').innerText = "Decoded: " + result;
            } catch(e) {
                alert("Invalid code format!");
            }
        }
    </script>
</body>
</html>
