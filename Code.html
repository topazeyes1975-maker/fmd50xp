<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher Codec</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; cursor: crosshair; touch-action: none; }
        .controls { margin-top: 30px; border-top: 2px solid #7c4dff; padding-top: 20px; }
        textarea { resize: none; width: 100%; height: 100px; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save to Cloud</button>
        <button onclick="loadAll()">Load from Cloud</button>
        <hr>
        <h3>Translator</h3>
        <textarea id="messageInput" placeholder="Type text here..."></textarea>
        <button onclick="encodeMessage()">Encode</button>
        <div id="resultArea" style="margin-top:10px; border:1px solid #7c4dff; padding:10px; min-height: 50px;"></div>
    </div>

    <script>
        // --- 1. FILL THESE IN ---
        const supabaseUrl = 'https://jhgcyiswxubqzqtbhain.supabase.co'; 
        const supabaseKey = 'sb_publishable_0j0PaDVT_pXMJawcf2W8fQ_Lz9B4KoW'; 
        
        const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');

        // Build the drawing boxes
        letters.forEach(letter => {
            container.innerHTML += `<div><p>${letter}</p><canvas id="canvas${letter}" width="80" height="80"></canvas></div>`;
        });

        // Optimized Drawing Logic
        letters.forEach(letter => {
            const canvas = document.getElementById('canvas' + letter);
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
            let drawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => { drawing = true; ctx.beginPath(); };
            const end = () => drawing = false;
            const move = (e) => {
                if (!drawing) return;
                if (e.cancelable) e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y); ctx.stroke();
            };

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mouseup', end);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('touchend', end);
            canvas.addEventListener('touchmove', move, {passive: false});
        });

        // Supabase Save Function
        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            let cipherData = {};
            letters.forEach(l => cipherData[l] = document.getElementById('canvas' + l).toDataURL());
            const { error } = await mySupabase.from('codelock').upsert([{ code: code, alphabet_data: cipherData }]);
            if (error) alert("Error: " + error.message); else alert("Saved!");
        }

        // Supabase Load Function
        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data } = await mySupabase.from('codelock').select('alphabet_data').eq('code', code).single();
            if (data) {
                letters.forEach(l => {
                    const canvas = document.getElementById('canvas' + l);
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0,0,80,80); ctx.drawImage(img, 0, 0); };
                    img.src = data.alphabet_data[l];
                });
            } else { alert("Code not found."); }
        }

        // Translation Logic
        function encodeMessage() {
            const input = document.getElementById('messageInput').value.toUpperCase();
            let html = "";
            for (let char of input) {
                if (letters.includes(char)) {
                    html += `<img src="${document.getElementById('canvas' + char).toDataURL()}" width="30"> `;
                }
            }
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
