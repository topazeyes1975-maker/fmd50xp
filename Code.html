<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher Codec - Universal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 20px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; touch-action: none; }
        .controls { margin-top: 20px; padding: 20px; border-top: 2px solid #7c4dff; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save to Cloud</button>
        <button onclick="loadAll()">Load from Cloud</button>
        <hr>
        <h3>Translator</h3>
        <textarea id="messageInput" placeholder="Type text here..."></textarea>
        <button onclick="encodeMessage()">Encode</button>
        <button onclick="decodeMessage()">Decode</button>
        <div id="resultArea" style="margin-top:10px; border:1px solid #7c4dff; padding:10px;"></div>
    </div>

    <script>
        // --- 1. CONFIGURE YOUR SUPABASE ---
        const supabaseUrl = 'YOUR_PROJECT_URL'; 
        const supabaseKey = 'YOUR_ANON_PUBLIC_KEY'; 
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');

        // Create the drawing boxes
        letters.forEach(letter => {
            container.innerHTML += `<div><p>${letter}</p><canvas id="canvas${letter}" width="80" height="80"></canvas></div>`;
        });

        // Initialize drawing for all boxes
        letters.forEach(letter => {
            const canvas = document.getElementById('canvas' + letter);
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
            let drawing = false;

            const draw = (e) => {
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke();
            };
            canvas.onmousedown = () => { drawing = true; ctx.beginPath(); };
            canvas.onmouseup = () => drawing = false;
            canvas.onmousemove = draw;
            canvas.ontouchmove = (e) => { draw(e); e.preventDefault(); };
        });

        // --- 2. SUPABASE FUNCTIONS ---
        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            let cipherData = {};
            letters.forEach(l => cipherData[l] = document.getElementById('canvas' + l).toDataURL());
            
            const { error } = await supabase.from('ciphers').upsert([{ code: code, alphabet_data: cipherData }]);
            if (error) alert("Error: " + error.message);
            else alert("Cipher saved to the cloud!");
        }

        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data, error } = await supabase.from('ciphers').select('alphabet_data').eq('code', code).single();
            if (data) {
                const cipherData = data.alphabet_data;
                letters.forEach(l => {
                    const canvas = document.getElementById('canvas' + l);
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0,0,80,80); ctx.drawImage(img, 0, 0); };
                    img.src = cipherData[l];
                });
            } else { alert("Code not found!"); }
        }

        // --- 3. TRANSLATOR LOGIC ---
        function encodeMessage() {
            const input = document.getElementById('messageInput').value.toUpperCase();
            let html = "";
            for (let char of input) {
                if (letters.includes(char)) {
                    html += `<img src="${document.getElementById('canvas' + char).toDataURL()}" width="30"> `;
                } else html += " ";
            }
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
