<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Codec</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a0b2e; color: white; font-family: sans-serif; padding: 10px; }
        #alphabet-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        canvas { border: 1px solid #7c4dff; background: #2d1b4e; width: 100%; aspect-ratio: 1; touch-action: none; }
        .controls { border-top: 2px solid #7c4dff; padding-top: 20px; }
        #messageVisualizer { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 5px; }
    </style>
</head>
<body>

    <h1>Cipher Codec</h1>
    <div id="alphabet-container"></div>

    <div class="controls">
        <input type="text" id="cipherCode" placeholder="Enter 6-digit code">
        <button onclick="saveAll()">Save</button>
        <button onclick="loadAll()">Load</button>
        <hr>
        <input type="text" id="messageInput" placeholder="Type word...">
        <button onclick="visualizeWord()">Generate</button>
        <div id="messageVisualizer"></div>
    </div>

    <script>
        const supabaseUrl = 'https://jhgcyiswxubqzqtbhain.supabase.co'; 
        const supabaseKey = 'sb_publishable_0j0PaDVT_pXMJawcf2W8fQ_Lz9B4KoW'; 
        const mySupabase = supabase.createClient(supabaseUrl, supabaseKey);

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const container = document.getElementById('alphabet-container');

        // Create the drawing pads
        letters.forEach(letter => {
            container.innerHTML += `<div><small>${letter}</small><canvas id="canvas${letter}"></canvas></div>`;
        });

        // Initialize drawing for each
        letters.forEach(letter => setupCanvas(document.getElementById('canvas' + letter)));

        function setupCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            let drawing = false;

            function getCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); const {x,y} = getCoords(e); ctx.moveTo(x,y); };
            canvas.onmousemove = (e) => { if(drawing) { const {x,y} = getCoords(e); ctx.lineTo(x,y); ctx.stroke(); } };
            canvas.onmouseup = () => { drawing = false; };
            
            canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const {x,y} = getCoords(e); ctx.moveTo(x,y); };
            canvas.ontouchmove = (e) => { if(drawing) { const {x,y} = getCoords(e); ctx.lineTo(x,y); ctx.stroke(); } };
            canvas.ontouchend = () => { drawing = false; };
        }

        async function saveAll() {
            const code = document.getElementById('cipherCode').value;
            let dataToSave = {};
            letters.forEach(l => dataToSave[l] = document.getElementById('canvas' + l).toDataURL());
            await mySupabase.from('codelock').upsert([{ Code: code, alphabet_data: dataToSave }]);
            alert("Saved!");
        }

        async function loadAll() {
            const code = document.getElementById('cipherCode').value;
            const { data } = await mySupabase.from('codelock').select('alphabet_data').eq('Code', code).single();
            if (data) {
                letters.forEach(l => {
                    const canvas = document.getElementById('canvas'+l);
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0,0,60,60); ctx.drawImage(img,0,0); };
                    img.src = data.alphabet_data[l];
                });
            } else { alert("Code not found."); }
        }

        function visualizeWord() {
            const word = document.getElementById('messageInput').value.toUpperCase();
            const viz = document.getElementById('messageVisualizer');
            viz.innerHTML = "";
            const old = document.getElementById('exportCanvas');
            if (old) old.remove();

            const box = 60;
            const exp = document.createElement('canvas');
            exp.id = "exportCanvas";
            exp.width = word.length * box; exp.height = box;
            const ctx = exp.getContext('2d');
            ctx.fillStyle = 'black'; ctx.fillRect(0,0,exp.width,exp.height);

            for (let i = 0; i < word.length; i++) {
                const src = document.getElementById('canvas' + word[i]);
                if (src) {
                    ctx.strokeStyle = 'white'; ctx.strokeRect(i*box, 0, box, box);
                    ctx.drawImage(src, i*box + 8, 8, box-16, box-16);
                    
                    const copy = document.createElement('canvas');
                    copy.width = box; copy.height = box;
                    copy.getContext('2d').drawImage(src, 0, 0);
                    viz.appendChild(copy);
                }
            }
            const btn = document.createElement('button');
            btn.innerText = "Download";
            btn.onclick = () => {
                let name = prompt("Name this key?", "my-key");
                if (name) {
                    const link = document.createElement('a');
                    link.download = name + ".png";
                    link.href = exp.toDataURL("image/png");
                    link.click();
                }
            };
            viz.appendChild(btn);
            document.body.appendChild(exp);
            exp.style.display = "none";
        }
    </script>
</body>
</html>
