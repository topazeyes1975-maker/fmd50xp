<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hex Protocol: Network Multiplayer</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; }
        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h2 { font-size: 3vh; margin: 5px 0; color: #00d4ff; letter-spacing: 2px; }
        
        #canvas-container {
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            position: relative;
        }
        canvas { max-width: 100%; max-height: 100%; }
        
        .win-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.95);
            padding: 20px 35px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            z-index: 50;
            letter-spacing: 2px;
            display: none;
            pointer-events: none;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            text-transform: uppercase;
        }
        
        .win-overlay.red-win { border: 2px solid #ff4444; color: #ff4444; box-shadow: 0 0 30px rgba(255, 68, 68, 0.3); }
        .win-overlay.blue-win { border: 2px solid #00d4ff; color: #00d4ff; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }

        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            font-size: 2vh;
            background-color: #222;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            width: 90%;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background-color: #111; box-shadow: 0 0 10px #00d4ff; }
        
        #currentTurn { font-weight: bold; font-size: 2.5vh; }
        .red-t { color: #ff4444; }
        .blue-t { color: #00d4ff; }
    </style>
</head>
<body>

    <h2>HEX PROTOCOL: ONLINE MAP</h2>
    <h6><p>how to play the game: Take turns globally. Red lines up horizontally (top to bottom goal boundaries). Blue lines up vertically (left to right goal boundaries). First unbroken chain across the canvas wins.</p></h6>
    
    <div id="canvas-container">
        <div id="winNotification" class="win-overlay"></div>
        <canvas id="hexCanvas" width="700" height="600"></canvas>
    </div>

    <div id="controls">
        <p>Active Transmission: <span id="currentTurn" class="red-t">LOADING NETWORK...</span></p>
        <button onclick="resetNetworkGame()">RESET GLOBAL SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const turnText = document.getElementById('currentTurn');
        const winNotification = document.getElementById('winNotification');

        const boardSize = 11;
        const hexRadius = 24;
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;
        const spacingX = hexWidth * 0.75;
        const spacingY = hexHeight;
        const startX = 60;
        const startY = 60;

        let board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
        let currentPlayer = 'Red'; 
        let gameActive = true;

        const redImg = new Image();
        redImg.src = '1778729047628.png';
        const blueImg = new Image();
        blueImg.src = '1778729094487.png';

        redImg.onload = drawBoard;
        blueImg.onload = drawBoard;

        function updateUI() {
            if (!gameActive) return;
            if (currentPlayer === 'Red') {
                turnText.innerText = "RED FREQUENCY ACTIVE";
                turnText.className = 'red-t';
            } else {
                turnText.innerText = "BLUE FREQUENCY ACTIVE";
                turnText.className = 'blue-t';
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 8;
            
            // Red Goals (Top & Bottom borders)
            ctx.strokeStyle = '#ff4444';
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(canvas.width, 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, canvas.height-10); ctx.lineTo(canvas.width, canvas.height-10); ctx.stroke();
            
            // Blue Goals (Left & Right borders)
            ctx.strokeStyle = '#00d4ff';
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(canvas.width-10, 0); ctx.lineTo(canvas.width-10, canvas.height); ctx.stroke();

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const x = startX + q * spacingX + r * spacingX / 2;
                    const y = startY + r * spacingY;
                    
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        const px = x + hexRadius * Math.cos(angle);
                        const py = y + hexRadius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    const p = board[q][r];
                    if (p) {
                        const img = (p === 'Red') ? redImg : blueImg;
                        const size = hexRadius * 1.5;
                        if (img.complete && img.naturalWidth !== 0) {
                            ctx.drawImage(img, x - size/2, y - size/2, size, size);
                        } else {
                            ctx.beginPath();
                            ctx.arc(x, y, hexRadius * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = (p === 'Red') ? '#ff4444' : '#00d4ff';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        function checkWin(player) {
            const visited = new Set();
            const stack = [];

            for (let i = 0; i < boardSize; i++) {
                if (player === 'Red' && board[i][0] === 'Red') stack.push({q: i, r: 0});
                if (player === 'Blue' && board[0][i] === 'Blue') stack.push({q: 0, r: i});
            }

            while (stack.length > 0) {
                const {q, r} = stack.pop();
                const key = `${q},${r}`;
                if (visited.has(key)) continue;
                visited.add(key);

                if (player === 'Red' && r === boardSize - 1) return true;
                if (player === 'Blue' && q === boardSize - 1) return true;

                const neighbors = getNeighbors(q, r);
                for (const n of neighbors) {
                    if (board[n.q][n.r] === player) stack.push(n);
                }
            }
            return false;
        }

        function getNeighbors(q, r) {
            const list = [
                {q: q+1, r: r}, {q: q-1, r: r},
                {q: q, r: r+1}, {q: q, r: r-1},
                {q: q-1, r: r+1}, {q: q+1, r: r-1}
            ];
            return list.filter(n => n.q >= 0 && n.q < boardSize && n.r >= 0 && n.r < boardSize);
        }

        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * sx;
            const my = (e.clientY - rect.top) * sy;

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const hx = startX + q * spacingX + r * spacingX / 2;
                    const hy = startY + r * spacingY;
                    const dist = Math.sqrt((mx - hx)**2 + (my - hy)**2);

                    if (dist < hexRadius && !board[q][r]) {
                        // Place piece for current global player
                        board[q][r] = currentPlayer;
                        drawBoard();
                        
                        if (checkWin(currentPlayer)) {
                            declareWinner(currentPlayer);
                        } else {
                            // Switch player turn and sync to Soba cloud backend
                            currentPlayer = (currentPlayer === 'Red') ? 'Blue' : 'Red';
                            updateUI();
                            saveGameToSoba();
                        }
                        return;
                    }
                }
            }
        });

        function declareWinner(player) {
            gameActive = false;
            winNotification.innerText = `${player.toUpperCase()} BRIDGE SECURED!`;
            winNotification.className = `win-overlay ${player.toLowerCase()}-win`;
            winNotification.style.display = 'block';
            saveGameToSoba();
        }

        function resetNetworkGame() {
            board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
            currentPlayer = 'Red';
            gameActive = true;
            winNotification.style.display = 'none';
            updateUI();
            drawBoard();
            saveGameToSoba(); // Wipe server data back to start state
        }

        // ==========================================
        // SOBA CLOUD SYNCHRONIZATION BACKEND
        // ==========================================

        function saveGameToSoba() {
            const gameState = {
                board: board,
                currentPlayer: currentPlayer,
                gameActive: gameActive
            };
            
            // SOBA INTEGRATION POINT: 
            // Replace console.log with your specific Soba database saving function.
            // Example: soba.set("hex_game_state", JSON.stringify(gameState));
            console.log("Saving state to Soba database...", gameState);
        }

        function loadGameFromSoba() {
            // SOBA INTEGRATION POINT:
            // Fetch the layout string state saved in your database here.
            // Example: let data = soba.get("hex_game_state");
            
            let data = null; // Replace with server read data string

            if (data) {
                const state = JSON.parse(data);
                board = state.board;
                currentPlayer = state.currentPlayer;
                gameActive = state.gameActive;
                
                if (!gameActive) {
                    // Check who won from data
                    const dynamicWin = checkWin('Red') ? 'Red' : 'Blue';
                    declareWinner(dynamicWin);
                } else {
                    winNotification.style.display = 'none';
                }
                
                updateUI();
                drawBoard();
            }
        }

        // Check for updates automatically every 3 seconds (3000ms)
        setInterval(loadGameFromSoba, 3000);

        // Initial launch configuration
        updateUI();
        loadGameFromSoba();
    </script>
</body>
</html>
