<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hex Protocol: Win Detection</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h2 { font-size: 3vh; margin: 5px 0; color: #00d4ff; letter-spacing: 2px; }
        #canvas-container {
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
        }
        canvas { max-width: 100%; max-height: 100%; }
        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            font-size: 2vh;
            background-color: #222;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            width: 90%;
        }
        #currentTurn { font-weight: bold; font-size: 2.5vh; }
        .red-t { color: #ff4444; }
        .blue-t { color: #00d4ff; }
    </style>
</head>
<body>

    <h2>HEX PROTOCOL</h2>

    <div id="canvas-container">
        <canvas id="hexCanvas" width="700" height="600"></canvas>
    </div>

    <div id="controls">
        <p>Active Frequency: <span id="currentTurn" class="red-t">RED</span></p>
        <button onclick="initGame()">RESET SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const turnText = document.getElementById('currentTurn');

        const boardSize = 11;
        const hexRadius = 24;
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;
        const spacingX = hexWidth * 0.75;
        const spacingY = hexHeight;
        const startX = 60;
        const startY = 60;

        let board = [];
        let currentPlayer = 'Red';
        let gameActive = true;

        const redImg = new Image();
        redImg.src = '1778729047628.png';
        const blueImg = new Image();
        blueImg.src = '1778729094487.png';

        redImg.onload = drawBoard;
        blueImg.onload = drawBoard;

        function initGame() {
            board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
            currentPlayer = 'Red';
            gameActive = true;
            updateUI();
            drawBoard();
        }

        function updateUI() {
            turnText.innerText = currentPlayer.toUpperCase();
            turnText.className = currentPlayer === 'Red' ? 'red-t' : 'blue-t';
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Edges to show goals
            ctx.lineWidth = 8;
            // Red Goals (Top and Bottom edges)
            ctx.strokeStyle = '#ff4444';
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(canvas.width, 10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, canvas.height-10); ctx.lineTo(canvas.width, canvas.height-10); ctx.stroke();
            
            // Blue Goals (Left and Right edges)
            ctx.strokeStyle = '#00d4ff';
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(canvas.width-10, 0); ctx.lineTo(canvas.width-10, canvas.height); ctx.stroke();

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const x = startX + q * spacingX + r * spacingX / 2;
                    const y = startY + r * spacingY;
                    
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        const px = x + hexRadius * Math.cos(angle);
                        const py = y + hexRadius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    const p = board[q][r];
                    if (p) {
                        const img = (p === 'Red') ? redImg : blueImg;
                        const size = hexRadius * 1.5;
                        if (img.complete && img.naturalWidth !== 0) {
                            ctx.drawImage(img, x - size/2, y - size/2, size, size);
                        } else {
                            ctx.beginPath();
                            ctx.arc(x, y, hexRadius * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = (p === 'Red') ? '#ff4444' : '#00d4ff';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        function checkWin(player) {
            const visited = new Set();
            const stack = [];

            // Starting points for each player
            for (let i = 0; i < boardSize; i++) {
                if (player === 'Red' && board[i][0] === 'Red') stack.push({q: i, r: 0});
                if (player === 'Blue' && board[0][i] === 'Blue') stack.push({q: 0, r: i});
            }

            while (stack.length > 0) {
                const {q, r} = stack.pop();
                const key = `${q},${r}`;
                if (visited.has(key)) continue;
                visited.add(key);

                // Win check (reached the other side)
                if (player === 'Red' && r === boardSize - 1) return true;
                if (player === 'Blue' && q === boardSize - 1) return true;

                // Check 6 neighbors
                const neighbors = [
                    {q: q+1, r: r}, {q: q-1, r: r},
                    {q: q, r: r+1}, {q: q, r: r-1},
                    {q: q-1, r: r+1}, {q: q+1, r: r-1}
                ];

                for (const n of neighbors) {
                    if (n.q >= 0 && n.q < boardSize && n.r >= 0 && n.r < boardSize) {
                        if (board[n.q][n.r] === player) stack.push(n);
                    }
                }
            }
            return false;
        }

        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * sx;
            const my = (e.clientY - rect.top) * sy;

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const hx = startX + q * spacingX + r * spacingX / 2;
                    const hy = startY + r * spacingY;
                    const dist = Math.sqrt((mx - hx)**2 + (my - hy)**2);

                    if (dist < hexRadius && !board[q][r]) {
                        board[q][r] = currentPlayer;
                        drawBoard();
                        
                        if (checkWin(currentPlayer)) {
                            gameActive = false;
                            setTimeout(() => {
                                alert(currentPlayer.toUpperCase() + " BRIDGE SECURED!");
                                initGame();
                            }, 100);
                        } else {
                            currentPlayer = (currentPlayer === 'Red') ? 'Blue' : 'Red';
                            updateUI();
                        }
                        return;
                    }
                }
            }
        });

        initGame();
    </script>
</body>
</html>
