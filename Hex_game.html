<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hex Game: Mobile Edition</title>
    <style>
        /* Universal Fit-to-Screen */
        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            background-color: #0a0a0c;
            color: #d1d1d1;
            padding: 10px;
            overflow: hidden;
        }

        h1 { font-size: 3vh; margin: 5px 0; color: #00d4ff; letter-spacing: 2px; }

        #canvas-container {
            width: 100%;
            height: 65vh; /* Takes up most of the screen */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            background-color: #1a1a1a;
        }

        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 30px;
            font-size: 2vh;
            cursor: pointer;
            background-color: #222;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            width: 80%;
        }

        #currentTurn {
            font-weight: bold;
            font-size: 2.5vh;
        }

        .red-turn { color: #ff4444; }
        .blue-turn { color: #00d4ff; }

    </style>
</head>
<body>
    <h1>HEX PROTOCOL</h1>

    <div id="canvas-container">
        <canvas id="hexGameCanvas" width="700" height="600"></canvas>
    </div>

    <div id="controls">
        <p>Active Frequency: <span id="currentTurn" class="red-turn">Red</span></p>
        <button id="resetButton">RE-SYNC GRID</button>
    </div>

    <script>
        const canvas = document.getElementById('hexGameCanvas');
        const ctx = canvas.getContext('2d');
        const resetButton = document.getElementById('resetButton');
        const currentTurnSpan = document.getElementById('currentTurn');

        const boardSize = 11; 
        const hexRadius = 22; // Slightly smaller to fit mobile
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;
        const hexSpacingX = hexWidth * 0.75;
        const hexSpacingY = hexHeight;

        const offsetX = 40;
        const offsetY = 60;

        let board = []; 
        let currentPlayer = 'Red'; 

        const redPieceImage = new Image();
        redPieceImage.src = '1778729047628.png'; 
        const bluePieceImage = new Image();
        bluePieceImage.src = '1778729094487.png'; 

        function initializeGame() {
            board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
            currentPlayer = 'Red';
            updateTurnDisplay();
            drawBoard();
        }

        function updateTurnDisplay() {
            currentTurnSpan.textContent = currentPlayer;
            currentTurnSpan.className = currentPlayer === 'Red' ? 'red-turn' : 'blue-turn';
        }

        function getHexagonPoints(x, y, radius) {
            const points = [];
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI / 3 * i;
                points.push({
                    x: x + radius * Math.cos(angle),
                    y: y + radius * Math.sin(angle)
                });
            }
            return points;
        }

        function drawHex(q, r, color = '#333') {
            const x = offsetX + q * hexSpacingX + r * hexSpacingX / 2;
            const y = offsetY + r * hexSpacingY;
            const points = getHexagonPoints(x, y, hexRadius);

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();

            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            ctx.stroke();

            return { centerX: x, centerY: y };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const { centerX, centerY } = drawHex(q, r);
                    const pieceType = board[q][r];

                    if (pieceType) {
                        const imgSize = hexRadius * 1.6;
                        const img = pieceType === 'Red' ? redPieceImage : bluePieceImage;
                        
                        // Check if image is loaded, otherwise draw a colored circle
                        if (img.complete && img.naturalWidth !== 0) {
                            ctx.drawImage(img, centerX - imgSize / 2, centerY - imgSize / 2, imgSize, imgSize);
                        } else {
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, hexRadius * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = pieceType === 'Red' ? '#ff4444' : '#00d4ff';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (event.clientX - rect.left) * scaleX;
            const mouseY = (event.clientY - rect.top) * scaleY;

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const hexX = offsetX + q * hexSpacingX + r * hexSpacingX / 2;
                    const hexY = offsetY + r * hexSpacingY;
                    const distance = Math.sqrt(Math.pow(mouseX - hexX, 2) + Math.pow(mouseY - hexY, 2));

                    if (distance < hexRadius && board[q][r] === null) {
                        board[q][r] = currentPlayer;
                        currentPlayer = currentPlayer === 'Red' ? 'Blue' : 'Red';
                        updateTurnDisplay();
                        drawBoard();
                        return;
                    }
                }
            }
        });

        resetButton.addEventListener('click', initializeGame);

        // Load images then start
        let imagesLoaded = 0;
        const totalImages = 2;
        function imageLoaded() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) initializeGame();
        }
        redPieceImage.onload = imageLoaded;
        bluePieceImage.onload = imageLoaded;
        redPieceImage.onerror = imageLoaded; // Start even if images fail
        bluePieceImage.onerror = imageLoaded;

        // Backup startup
        setTimeout(() => { if(imagesLoaded < totalImages) initializeGame(); }, 1000);

    </script>
</body>
</html>
