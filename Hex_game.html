<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hex Protocol</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h2 { font-size: 3vh; margin: 5px 0; color: #00d4ff; letter-spacing: 2px; }
        #canvas-container {
            width: 100%;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
        }
        canvas { max-width: 100%; max-height: 100%; }
        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            font-size: 2vh;
            background-color: #222;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            width: 90%;
        }
        #currentTurn { font-weight: bold; font-size: 2.5vh; }
        .red-t { color: #ff4444; }
        .blue-t { color: #00d4ff; }
    </style>
</head>
<body>

    <h2>HEX PROTOCOL</h2>

    <div id="canvas-container">
        <canvas id="hexCanvas" width="700" height="600"></canvas>
    </div>

    <div id="controls">
        <p>Active Turn: <span id="currentTurn" class="red-t">RED</span></p>
        <button onclick="initGame()">RESET SYSTEM</button>
    </div>

    <script>
        const canvas = document.getElementById('hexCanvas');
        const ctx = canvas.getContext('2d');
        const turnText = document.getElementById('currentTurn');

        const boardSize = 11;
        const hexRadius = 24;
        const hexHeight = hexRadius * Math.sqrt(3);
        const hexWidth = hexRadius * 2;
        const spacingX = hexWidth * 0.75;
        const spacingY = hexHeight;
        const startX = 60;
        const startY = 60;

        let board = [];
        let currentPlayer = 'Red';

        // Images with full paths
        const redImg = new Image();
        redImg.src = '1778729047628.png';
        const blueImg = new Image();
        blueImg.src = '1778729094487.png';

        // Redraw when images load
        redImg.onload = drawBoard;
        blueImg.onload = drawBoard;

        function initGame() {
            board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
            currentPlayer = 'Red';
            updateUI();
            drawBoard();
        }

        function updateUI() {
            turnText.innerText = currentPlayer.toUpperCase();
            turnText.className = currentPlayer === 'Red' ? 'red-t' : 'blue-t';
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const x = startX + q * spacingX + r * spacingX / 2;
                    const y = startY + r * spacingY;
                    
                    // Draw Hexagon
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        const px = x + hexRadius * Math.cos(angle);
                        const py = y + hexRadius * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = '#444';
                    ctx.stroke();

                    // Draw Piece
                    const p = board[q][r];
                    if (p) {
                        const img = (p === 'Red') ? redImg : blueImg;
                        const size = hexRadius * 1.5;
                        if (img.complete && img.naturalWidth !== 0) {
                            ctx.drawImage(img, x - size/2, y - size/2, size, size);
                        } else {
                            // Color fallback so it's never "blank"
                            ctx.beginPath();
                            ctx.arc(x, y, hexRadius * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = (p === 'Red') ? '#ff4444' : '#00d4ff';
                            ctx.fill();
                        }
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * sx;
            const my = (e.clientY - rect.top) * sy;

            for (let q = 0; q < boardSize; q++) {
                for (let r = 0; r < boardSize; r++) {
                    const hx = startX + q * spacingX + r * spacingX / 2;
                    const hy = startY + r * spacingY;
                    const dist = Math.sqrt((mx - hx)**2 + (my - hy)**2);

                    if (dist < hexRadius && !board[q][r]) {
                        board[q][r] = currentPlayer;
                        currentPlayer = (currentPlayer === 'Red') ? 'Blue' : 'Red';
                        updateUI();
                        drawBoard();
                        return;
                    }
                }
            }
        });

        initGame();
    </script>
</body>
</html>
