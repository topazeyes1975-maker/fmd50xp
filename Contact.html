<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact the Creator</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #333;
            padding: 40px;
            border-radius: 15px;
            background: #111;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #a855f7; letter-spacing: 3px; }
        p { line-height: 1.6; font-size: 1.1rem; }
        .contact-link {
            display: block;
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #a855f7;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .contact-link:hover { background: #a855f7; color: #000; }
        .back-btn { margin-top: 20px; color: #888; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE GATEWAY</h1>
        <p>Your correspondence is received through the Ark.</p>
        
        <a href="mailto: firewaterfall@yahoo.com" class="contact-link">SEND A MESSAGE</a>
        <a href="https://github.com/yourprofile" class="contact-link">VIEW THE ARCHIVES (GITHUB)</a>
