<head>
    <meta charset="UTF-8">

    <title>Media Library Collection | Archive</title>
    <style>
        /* 1. THE FOUNDATION (FMD50XP ARCHITECT COLORS) */
        :root {
            --primary: #00f0ff;  /* Cyan */
            --accent: #ff007a;   /* Pink */
            --bg: #050505;       /* Solid Deep Black */
            --card-bg: #111;     /* Card Dark Gray */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* 2. STICKY NAV BAR ORGANIZED TO MATCH PORTFOLIO */
        nav {
            background: #000;
            border-bottom: 1px solid #222;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover { 
            color: var(--accent); 
            text-shadow: 0 0 8px var(--accent); 
        }

        /* 3. LAYOUT CONTAINER */
        .library-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px; /* Smooth spacing between rows */
        }

        /* Compact Grid Row matching the 3D model structures */
        .library-row {
            display: grid;
            grid-template-columns: 60px 1fr 2fr; /* Picture, Info, Audio Player */
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #222;
            gap: 1.5rem;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .library-row:hover {
            background-color: #1a1a1a;
            border-color: var(--primary);
        }

        /* Consistent Image Thumbnail */
        .media-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #222;
        }

        /* Text Details Column */
        .media-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .media-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0 0 4px 0;
            color: #ffffff;
        }

        .media-subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin: 0;
            font-style: italic;
        }

        /* 4. THE AUDIO COLOR FIX FILTER */
        .audio-player-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        audio {
            width: 100%;
            max-width: 400px;
            height: 36px;
            border-radius: 30px;
            /* Inverts default browser colors and rotates the hue spectrum to match your Cyan theme */
            filter: invert(0.9) hue-rotate(140deg) brightness(1.1) saturate(1.5);
        }

        /* Responsive adjustments for phone view */
        @media (max-width: 650px) {
            .library-row {
                grid-template-columns: 60px 1fr;
                gap: 1rem;
                padding: 15px;
            }
            .audio-player-container {
                grid-column: span 2;
                justify-content: center;
                width: 100%;
                margin-top: 5px;
            }
            audio {
                max-width: 100%;
            }
        }
    </style>
</head>
