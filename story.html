<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library Collection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 2rem;
        }

        .library-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem; /* Tight spacing between rows */
        }

        /* Compact Grid Row */
        .library-row {
            display: grid;
            grid-template-columns: 60px 1fr 2fr; /* Picture, Info, Music Player */
            align-items: center;
            background-color: #1e1e1e;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            gap: 1.5rem;
            transition: background-color 0.2s ease;
        }

        .library-row:hover {
            background-color: #2a2a2a;
        }

        /* Small, Consistent Image Container */
        .media-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #333;
        }

        /* Text Details Column */
        .media-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .media-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 0 0.2rem 0;
            color: #ffffff;
        }

        .media-subtitle {
            font-size: 0.8rem;
            color: #b3b3b3;
            margin: 0;
        }

        /* Compact Native Audio Player Column */
        .audio-player-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        audio {
            width: 100%;
            max-width: 400px;
            height: 32px; /* Keeps the native player short and sleek */
        }

        /* Responsive adjustments for narrow screens */
        @media (max-width: 650px) {
            .library-row {
                grid-template-columns: 50px 1fr;
                gap: 1rem;
                padding: 0.75rem;
            }
            .audio-player-container {
                grid-column: span 2;
                justify-content: center;
                width: 100%;
            }
            audio {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="library-container">

        <!-- Item 1 -->
        <div class="library-row">
            <img src="path-to-your-image1.jpg" alt="Track 1 Cover" class="media-thumb">
            <div class="media-info">
                <h3 class="media-title">Track Title One</h3>
                <p class="media-subtitle">Collection Name / Tags</p>
            </div>
            <div class="audio-player-container">
                <audio controls src="path-to-your-audio1.mp3"></audio>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="library-row">
            <img src="path-to-your-image2.jpg" alt="Track 2 Cover" class="media-thumb">
            <div class="media-info">
                <h3 class="media-title">Track Title Two</h3>
                <p class="media-subtitle">Collection Name / Tags</p>
            </div>
            <div class="audio-player-container">
                <audio controls src="path-to-your-audio2.mp3"></audio>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="library-row">
            <img src="path-to-your-image3.jpg" alt="Track 3 Cover" class="media-thumb">
            <div class="media-info">
                <h3 class="media-title">Track Title Three</h3>
                <p class="media-subtitle">Collection Name / Tags</p>
            </div>
            <div class="audio-player-container">
                <audio controls src="path-to-your-audio3.mp3"></audio>
            </div>
        </div>

    </div>

</body>
</html>
