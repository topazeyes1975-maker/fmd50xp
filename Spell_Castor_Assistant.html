<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Internal Ark: DNA Forge</title>
    <style>
        /* Universal Mobile Setup */
        * { box-sizing: border-box; touch-action: none; }

        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }

        h2 { font-size: 3.5vh; margin: 0; letter-spacing: 2px; color: #a855f7; text-align: center; }

        #log {
            font-size: 2.2vh;
            color: #888;
            text-align: center;
            height: 5vh;
            margin-top: 10px;
        }

        #cauldron-area {
            position: relative;
            width: 100%;
            height: 40vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        #cauldron {
            width: 220px;
            height: 200px;
            background: #1a1a1a;
            border: 8px solid #333;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
        }

        #potion {
            position: absolute;
            top: 15%;
            left: 10%;
            right: 10%;
            bottom: 20%;
            background: #22c55e;
            border-radius: 50%;
            filter: blur(4px);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ingredient-shelf {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }

        .item {
            aspect-ratio: 1/1;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5vh;
            cursor: grab;
            user-select: none;
        }

        /* Explosion Shake */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, 2px) rotate(-1deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            80% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .reset-btn {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #a855f7;
            color: #a855f7;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 2vh;
        }
    </style>
</head>
<body>

    <h2>THE INTERNAL ARK</h2>
    
    <div id="log">Awaiting DNA Samples...</div>

    <div id="cauldron-area">
        <div id="cauldron" id="main-pot">
            <div id="potion"></div>
        </div>
    </div>

    <div class="ingredient-shelf">
        <div class="item" data-color="#ef4444" data-name="Fox Tail">🦊</div>
        <div class="item" data-color="#3b82f6" data-name="Butterfly Wing">🦋</div>
        <div class="item" data-color="#eab308" data-name="Star Dust">✨</div>
        <div class="item" data-color="#22c55e" data-name="Caterpillar">🐛</div>
    </div>

    <button class="reset-btn" onclick="resetPot()">PURGE CAULDRON</button>

    <script>
        const potion = document.getElementById('potion');
        const log = document.getElementById('log');
        const cauldron = document.getElementById('cauldron');
        const items = document.querySelectorAll('.item');

        // REPLACE FILENAMES: Update these with your GitHub image names!
        const animalRecipes = {
            "Butterfly Wing,Fox Tail": { name: "Vulpes-Fly", img: "vulpes_fly.png" },
            "Caterpillar,Star Dust": { name: "Stellapod", img: "stellapod.png" }
        };

        let currentIngredients = [];

        items.forEach(item => {
            item.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const startPos = { x: item.offsetLeft, y: item.offsetTop };
                item.style.position = 'fixed';
                item.style.zIndex = '1000';
                
                function moveAt(pageX, pageY) {
                    item.style.left = pageX - item.offsetWidth / 2 + 'px';
                    item.style.top = pageY - item.offsetHeight / 2 + 'px';
                }

                function onTouchMove(event) {
                    moveAt(event.touches[0].pageX, event.touches[0].pageY);
                }

                document.addEventListener('touchmove', onTouchMove);

                item.ontouchend = function() {
                    document.removeEventListener('touchmove', onTouchMove);
                    const cRect = cauldron.getBoundingClientRect();
                    const iRect = item.getBoundingClientRect();

                    if (iRect.left < cRect.right && iRect.right > cRect.left &&
                        iRect.top < cRect.bottom && iRect.bottom > cRect.top) {
                        addIngredient(item.dataset.name, item.dataset.color);
                    }
                    
                    item.style.position = 'static';
                };
            });
        });

        function addIngredient(name, color) {
            if (currentIngredients.includes(name)) return; // No duplicates
            currentIngredients.push(name);
            potion.style.background = color;
            
            let currentCombo = currentIngredients.slice().sort().join(',');

            if (animalRecipes[currentCombo]) {
                const creature = animalRecipes[currentCombo];
                log.innerText = "FORGE SUCCESS: " + creature.name;
                log.style.color = "#00d4ff";
                potion.style.backgroundImage = `url('${creature.img}')`;
                potion.style.backgroundSize = "contain";
                potion.style.backgroundRepeat = "no-repeat";
                potion.style.filter = "none";
            } 
            else if (currentIngredients.length >= 2) {
                triggerExplosion();
            } 
            else {
                log.innerText = "DNA Link: " + currentIngredients.join(" + ");
                log.style.color = "#888";
            }
        }

        function triggerExplosion() {
            log.innerText = "STABILITY LOST: DNA MISMATCH!";
            log.style.color = "#ff4444";
            potion.style.background = "radial-gradient(circle, #fff, #ff4444, #000)";
            cauldron.style.animation = "shake 0.5s";

            setTimeout(() => {
                alert("CRITICAL FAILURE: The DNA combination was unstable. You failed to create a creature.");
                cauldron.style.animation = ""; 
                resetPot();
            }, 600);
        }

        function resetPot() {
            currentIngredients = [];
            potion.style.background = "#22c55e";
            potion.style.backgroundImage = "none";
            potion.style.filter = "blur(4px)";
            log.innerText = "Cauldron Cleansed.";
            log.style.color = "#888";
        }
    </script>
</body>
</html>
