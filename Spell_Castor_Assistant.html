<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Internal Ark: DNA Forge</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; touch-action: manipulation; }
        body {
            background-color: #0a0a0c; color: #d1d1d1; font-family: 'Garamond', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; margin: 0; padding: 15px; overflow: hidden;
        }
        h2 { font-size: 3.5vh; margin: 0; letter-spacing: 2px; color: #a855f7; text-align: center; }
        #log { font-size: 2.2vh; color: #888; text-align: center; min-height: 5vh; margin-top: 10px; }
        
        #cauldron-area {
            position: relative; width: 100%; height: 35vh;
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px;
        }
        
        #cauldron {
            width: 240px; height: 200px; background: #1a1a1a; border: 8px solid #333;
            border-radius: 50% 50% 40% 40%; position: relative;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            overflow: visible; /* Let bubbles float out */
        }

        #potion-surface {
            position: absolute; top: 10%; left: 5%; right: 5%; bottom: 15%;
            background: radial-gradient(circle, #22c55e, #14532d);
            border-radius: 50%; filter: blur(6px); transition: all 0.5s ease; z-index: 1;
        }

        #creatureVideo {
            width: 170px; height: 170px; z-index: 5; display: none;
            object-fit: contain; border-radius: 50%;
        }

        /* Bubble Atmosphere */
        .bubble {
            position: absolute;
            background: rgba(34, 197, 94, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            bottom: 20%;
            z-index: 10; /* Float in front of video */
            animation: rise 3s infinite ease-in;
            pointer-events: none;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        .ingredient-shelf {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            padding: 15px; background: #111; border: 1px solid #333; border-radius: 12px;
            width: 100%; max-width: 450px;
        }
        .item {
            aspect-ratio: 1/1; background: #222; border: 1px solid #444; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 3.5vh;
            cursor: pointer; transition: transform 0.2s;
        }
        .item:active { transform: scale(0.9); }
        .reset-btn {
            width: 100%; max-width: 450px; padding: 12px; background: #1a1a1a;
            border: 1px solid #a855f7; color: #a855f7; border-radius: 6px; font-size: 2vh;
        }
    </style>
</head>
<body onload="startBubbles()">

    <h2>THE INTERNAL ARK</h2>
    <div id="log">Tap Ingredients to Forge...</div>

    <div id="cauldron-area">
        <div id="cauldron">
            <div id="potion-surface"></div>
            <video id="creatureVideo" loop playsinline></video>
        </div>
    </div>

    <div class="ingredient-shelf">
        <div class="item" onclick="addIngredient('pepper', '#468e3c')">🌶️</div>
        <div class="item" onclick="addIngredient('cinnamon', '#47f397')">🪵</div>
        <div class="item" onclick="addIngredient('book', '#ef4844')">📖</div>
        <div class="item" onclick="addIngredient('meteorite', '#ef4464')">☄️</div>
        <div class="item" onclick="addIngredient('lion mane', '#ef4445')">🦁</div>
        <div class="item" onclick="addIngredient('Fire', '#ef4443')">🔥</div>
        <div class="item" onclick="addIngredient('Butterfly Wing', '#3b82f6')">🐉</div>
        <div class="item" onclick="addIngredient('Star Dust', '#eab308')">✨</div>
        <div class="item" onclick="addIngredient('human heart', '#22c55e')">❤️</div>
    </div>

    <button class="reset-btn" onclick="resetPot()">PURGE CAULDRON</button>

    <script>
        const potion = document.getElementById('potion-surface');
        const video = document.getElementById('creatureVideo');
        const log = document.getElementById('log');
        const cauldron = document.getElementById('cauldron');

        const animalRecipes = {
            "book,lion mane,meteorite": { name: "Crystal Lion Earapea", file: "water-pixa-e89099009877-0-0159b684d2b9.mp4" },
            "Star Dust,book,human heart": { name: "Sentient", file: "water-pixa-419b8932e688-0-fdb0ea7380d8.mp4" },
            "Star Dust,cinnamon,lion mane": { name: "Cinnamon Chimera", file: "water-pixa-295bce50d9b0-0-6f5bb6446711 (4).mp4" },
            "Butterfly Wing,Fire,pepper": { name: "Pepper Dragon", file: "Project_05-13_Full HD 1080p_MEDIUM_FR30.mp4" }
        };

        let currentIngredients = [];

        function startBubbles() {
            setInterval(() => {
                const b = document.createElement('div');
                b.className = 'bubble';
                const size = Math.random() * 15 + 5 + 'px';
                b.style.width = size;
                b.style.height = size;
                b.style.left = Math.random() * 60 + 20 + '%';
                b.style.animationDuration = Math.random() * 2 + 2 + 's';
                cauldron.appendChild(b);
                setTimeout(() => b.remove(), 4000);
            }, 400);
        }

        function addIngredient(name, color) {
            if (currentIngredients.includes(name)) return;
            currentIngredients.push(name);
            potion.style.background = color;
            log.innerText = "DNA Link: " + currentIngredients.join(" + ");
            
            let currentCombo = currentIngredients.slice().sort().join(',');
            if (animalRecipes[currentCombo]) {
                const creature = animalRecipes[currentCombo];
                log.innerText = "FORGE SUCCESS: " + creature.name;
                log.style.color = "#00d4ff";
                video.src = creature.file;
                video.style.display = 'block';
                video.play();
                potion.style.opacity = '0.3'; // Keep a little green glow
            } 
            else if (currentIngredients.length >= 3) {
                alert("CRITICAL FAILURE: DNA MISMATCH!");
                resetPot();
            }
        }

        function resetPot() {
            currentIngredients = [];
            video.style.display = 'none';
            video.src = "";
            potion.style.opacity = '1';
            potion.style.background = "#22c55e";
            log.innerText = "Cauldron Cleansed.";
            log.style.color = "#888";
        }
    </script>
</body>
</html>
