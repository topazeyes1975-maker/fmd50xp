<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imparare l'Italiano - Hotel Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1e1e1e; 
            color: #fff; 
            text-align: center; 
            padding: 20px;
        }
        .game-container { 
            max-width: 600px; 
            margin: 40px auto; 
            background: #2d2d2d;
            padding: 30px; 
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-top: 8px solid #008c45; 
            border-bottom: 8px solid #cd212a; 
        }
        h2 { margin-top: 0; color: #f4f4f4; }
        #location-title { color: #ffc107; font-weight: bold; margin-bottom: 5px; }
        .status-badge {
            background: #444;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .officer-box {
            background: #1a1a1a;
            border-left: 4px solid #ffc107;
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }
        .officer-text { 
            font-size: 1.4rem; 
            font-weight: bold;
            color: #5cb85c; 
            margin: 0 0 10px 0;
        }
        .translation {
            font-size: 1rem;
            color: #aaa;
            font-style: italic;
            margin: 0;
        }
        .mic-btn { 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            background: #cd212a; 
            color: white; 
            border: none; 
            border-radius: 30px;
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        .mic-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .mic-listening { background: #ffc107 !important; color: #000 !important; }
        .feedback { 
            margin-top: 25px; 
            font-size: 1.1rem;
            min-height: 50px;
            line-height: 1.5;
        }
        .heard-text { color: #ffc107; font-weight: bold; }
        .fail-text { color: #dc3545; font-weight: bold; }
        .success-text { color: #28a745; font-weight: bold; }
        
        input[type="text"] {
            padding: 12px; width: 55%; font-size: 1rem; border-radius: 4px; border: none; margin-top: 10px;
            background: #444; color: white;
        }
        button.submit-btn {
            padding: 12px 20px; font-size: 1rem; background: #008c45; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .reset-btn {
            background: none; border: 1px solid #555; color: #888; padding: 5px 10px; border-radius: 4px; margin-top: 30px; cursor: pointer; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h3 id="location-title">STAGE 3: HOTEL LOBBY</h3>
        <h2>The Front Desk Check-In</h2>
        <div class="status-badge" id="game-status">Step 1 of 3</div>
        
        <div class="officer-box">
            <p class="officer-text" id="officer-speech">"Buongiorno! Benvenuta all'hotel. Come posso aiutarla?"</p>
            <p class="translation" id="officer-translation">(Good morning! Welcome to the hotel. How can I help you?)</p>
        </div>
        
        <button class="mic-btn" id="speak-btn">🎤 Click & Speak</button>
        
        <div id="input-fallback-zone">
            <input type="text" id="text-response" placeholder="Or type your response here...">
            <button id="submit-text-btn" class="submit-btn">Submit</button>
        </div>
        
        <div class="feedback" id="game-feedback">
            <span style="color: #aaa;">Tip: Greet the receptionist and mention that you have a reservation ("prenotazione").</span>
        </div>

        <button class="reset-btn" id="hard-restart-btn">⚙ Restart Hotel Lobby</button>
    </div>

    <script>
        let currentStep = 1;
        let recognition = null;
        let backupTimeout = null;
        let isTransitioning = false; 

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const speakBtn = document.getElementById('speak-btn');
        const officerSpeech = document.getElementById('officer-speech');
        const officerTranslation = document.getElementById('officer-translation');
        const gameFeedback = document.getElementById('game-feedback');
        const gameStatus = document.getElementById('game-status');
        const locationTitle = document.getElementById('location-title');
        const textResponse = document.getElementById('text-response');
        const submitTextBtn = document.getElementById('submit-text-btn');
        const hardRestartBtn = document.getElementById('hard-restart-btn');

        function startListening() {
            if (!SpeechRecognition || isTransitioning) return; 
            stopListeningEngine();

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'it-IT';
                recognition.interimResults = false;

                recognition.onstart = () => {
                    speakBtn.textContent = "Listening... Speak now!";
                    speakBtn.classList.add('mic-listening');
                    backupTimeout = setTimeout(() => { stopListeningEngine(); }, 6000);
                };

                recognition.onresult = (event) => {
                    clearTimeout(backupTimeout);
                    const speechResult = event.results[0][0].transcript;
                    stopListeningEngine();
                    processInput(speechResult);
                };
                
                recognition.onerror = () => { 
                    clearTimeout(backupTimeout);
                    stopListeningEngine();
                };

                recognition.onend = () => {
                    clearTimeout(backupTimeout);
                    if(!isTransitioning) {
                        speakBtn.textContent = "🎤 Click & Speak";
                        speakBtn.classList.remove('mic-listening');
                    }
                };

                recognition.start();
            } catch (e) {
                stopListeningEngine();
            }
        }

        function stopListeningEngine() {
            clearTimeout(backupTimeout);
            if (recognition) {
                try { recognition.abort(); } catch(e) {}
                recognition = null;
            }
            if (speakBtn && !isTransitioning) {
                speakBtn.textContent = "🎤 Click & Speak";
                speakBtn.classList.remove('mic-listening');
            }
        }

        if (speakBtn) speakBtn.addEventListener('click', startListening);

        submitTextBtn.addEventListener('click', () => {
            if(!isTransitioning && textResponse.value.trim() !== "") {
                stopListeningEngine();
                processInput(textResponse.value);
                textResponse.value = "";
            }
        });

        textResponse.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isTransitioning && textResponse.value.trim() !== "") {
                stopListeningEngine();
                processInput(textResponse.value);
                textResponse.value = "";
            }
        });

        hardRestartBtn.addEventListener('click', () => {
            stopListeningEngine();
            currentStep = 1;
            isTransitioning = false;
            gameFeedback.innerHTML = "<span style='color: #aaa;'>Lobby reset. Walk back up to the desk!</span>";
            updateScene();
        });

        function processInput(rawInput) {
            if (isTransitioning) return; 
            const cleanInput = rawInput.toLowerCase().trim();
            
            // --- STAGE 3: HOTEL CHECK-IN ---
            if (currentStep === 1) {
                const checkReservation = cleanInput.includes("prenotazione") || cleanInput.includes("prenotato") || cleanInput.includes("reservation");
                const checkGreeting = cleanInput.includes("buongiorno") || cleanInput.includes("buonasera") || cleanInput.includes("hello");
                
                if (checkReservation || (checkGreeting && cleanInput.includes("hotel"))) {
                    triggerStepAdvance(2, `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Excellent. The clerk smiles and checks the system.</span>`);
                } else if (cleanInput.includes("ciao")) {
                    triggerReset('You used "Ciao". Keep it formal with the hotel staff!');
                } else {
                    triggerReset('The clerk looks blankly at you. Try saying you have a reservation ("Ho una prenotazione").');
                }
            } 
            else if (currentStep === 2) {
                // Looking for her name or confirmation
                if (cleanInput.includes("fonda") || cleanInput.includes("dutton") || cleanInput.includes("mi chiamo") || cleanInput.includes("my name")) {
                    triggerStepAdvance(3, `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Perfect! They found your booking for a room with a beautiful city view.</span>`);
                } else {
                    triggerReset('You didn\'t give your name clearly. Tell them "Mi chiamo Fonda".');
                }
            } 
            else if (currentStep === 3) {
                const askedForKeys = cleanInput.includes("chiavi") || cleanInput.includes("chiave") || cleanInput.includes("key") || cleanInput.includes("keys");
                const polite = cleanInput.includes("per favore") || cleanInput.includes("grazie") || cleanInput.includes("please");

                if (askedForKeys || polite) {
                    triggerStepAdvance(4, `You entered: <span class='heard-text'>"${rawInput}"</span><br><br><span class='success-text'>★ STAGE 3 COMPLETE! ★</span><br>The clerk hands over the brass keys. Room 402 is all yours! Time to unpack and relax.`);
                } else {
                    triggerReset('You just stared at them! Ask for the keys politely: "Le chiavi, per favore."');
                }
            }
        }

        function triggerStepAdvance(nextStep, successMessage) {
            isTransitioning = true;
            if(speakBtn) {
                speakBtn.disabled = true;
                speakBtn.textContent = "⏳ Saving Step...";
                speakBtn.classList.remove('mic-listening');
            }
            gameFeedback.innerHTML = successMessage;
            currentStep = nextStep;

            setTimeout(() => {
                isTransitioning = false;
                updateScene();
            }, 1500);
        }

        function updateScene() {
            if(isTransitioning) return;

            if (speakBtn) {
                speakBtn.disabled = false;
                speakBtn.textContent = "🎤 Click & Speak";
            }

            if (currentStep <= 3) {
                locationTitle.textContent = "STAGE 3: HOTEL LOBBY";
                gameStatus.textContent = `Step ${currentStep} of 3`;
            }

            if (currentStep === 1) {
                officerSpeech.textContent = '"Buongiorno! Benvenuta all\'hotel. Come posso aiutarla?"';
                officerTranslation.textContent = '(Good morning! Welcome to the hotel. How can I help you?)';
            } else if (currentStep === 2) {
                officerSpeech.textContent = '"Certamente. Qual è il suo nome, per favore?"';
                officerTranslation.textContent = '(Certainly. What is your name, please?)';
                gameFeedback.innerHTML = `<span style="color: #aaa;">Tip: State your name clearly. Try: "Mi chiamo Fonda".</span>`;
            } else if (currentStep === 3) {
                officerSpeech.textContent = '"Ah, sì! Trovata. Ecco qui i suoi documenti."';
                officerTranslation.textContent = '(Ah, yes! Found it. Here are your documents.)';
                gameFeedback.innerHTML = `<span style="color: #ffc107; font-weight: bold;">Final Check! Ask for your room keys: "Le chiavi, per favore."</span>`;
            } else if (currentStep === 4) {
                locationTitle.textContent = "STAGE 3 COMPLETE";
                gameStatus.textContent = "VICTORY";
                officerSpeech.textContent = '"Buon soggiorno a Roma!"';
                officerTranslation.textContent = '(Have a great stay in Rome!)';
                document.getElementById('input-fallback-zone').style.display = "none";
                if(speakBtn) speakBtn.style.display = "none";
            }
        }

        function triggerReset(reason) {
            isTransitioning = true;
            stopListeningEngine();
            
            currentStep = 1;
            gameFeedback.innerHTML = `<span class='fail-text'>LOBBY RESET!</span><br>${reason}<br><br><span style="color: #aaa;">Step back into line at the front desk and let's try again!</span>`;

            setTimeout(() => {
                isTransitioning = false;
                updateScene();
            }, 1500);
        }
    </script>
</body>
</html>
