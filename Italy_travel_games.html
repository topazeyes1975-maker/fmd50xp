<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imparare l'Italiano - Crash-Proof Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1e1e1e; 
            color: #fff; 
            text-align: center; 
            padding: 20px;
        }
        .game-container { 
            max-width: 600px; 
            margin: 40px auto; 
            background: #2d2d2d;
            padding: 30px; 
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-top: 8px solid #008c45; 
            border-bottom: 8px solid #cd212a; 
        }
        h2 { margin-top: 0; color: #f4f4f4; }
        #location-title { color: #ffc107; font-weight: bold; margin-bottom: 5px; }
        .status-badge {
            background: #444;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .officer-box {
            background: #1a1a1a;
            border-left: 4px solid #008c45;
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }
        .officer-text { 
            font-size: 1.4rem; 
            font-weight: bold;
            color: #5cb85c; 
            margin: 0 0 10px 0;
        }
        .translation {
            font-size: 1rem;
            color: #aaa;
            font-style: italic;
            margin: 0;
        }
        .mic-btn { 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            background: #cd212a; 
            color: white; 
            border: none; 
            border-radius: 30px;
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .mic-btn:disabled { background: #555; cursor: not-allowed; }
        .mic-listening { background: #ffc107 !important; color: #000 !important; }
        .feedback { 
            margin-top: 25px; 
            font-size: 1.1rem;
            min-height: 50px;
            line-height: 1.5;
        }
        .heard-text { color: #ffc107; font-weight: bold; }
        .fail-text { color: #dc3545; font-weight: bold; }
        .success-text { color: #28a745; font-weight: bold; }
        
        input[type="text"] {
            padding: 12px; width: 55%; font-size: 1rem; border-radius: 4px; border: none; margin-top: 10px;
            background: #444; color: white;
        }
        button.submit-btn {
            padding: 12px 20px; font-size: 1rem; background: #008c45; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .reset-btn {
            background: none; border: 1px solid #555; color: #888; padding: 5px 10px; border-radius: 4px; margin-top: 30px; cursor: pointer; font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h3 id="location-title">STAGE 1: AIRPORT DESK</h3>
        <h2>Passport & Transit Control</h2>
        <div class="status-badge" id="game-status">Step 1 of 6</div>
        
        <div class="officer-box">
            <p class="officer-text" id="officer-speech">"Passaporto, prego."</p>
            <p class="translation" id="officer-translation">(Passport, please.)</p>
        </div>
        
        <button class="mic-btn" id="speak-btn">🎤 Click & Speak</button>
        
        <div id="input-fallback-zone">
            <input type="text" id="text-response" placeholder="Or type your response here...">
            <button id="submit-text-btn" class="submit-btn">Submit</button>
        </div>
        
        <div class="feedback" id="game-feedback">
            <span style="color: #aaa;">Tip: Greet the customs officer formally to begin. Do not use casual words like "Ciao".</span>
        </div>

        <button class="reset-btn" id="hard-restart-btn">⚙ Restart Entire Game</button>
    </div>

    <script>
        let currentStep = 1;
        let recognition = null;
        let backupTimeout = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const speakBtn = document.getElementById('speak-btn');
        const officerSpeech = document.getElementById('officer-speech');
        const officerTranslation = document.getElementById('officer-translation');
        const gameFeedback = document.getElementById('game-feedback');
        const gameStatus = document.getElementById('game-status');
        const locationTitle = document.getElementById('location-title');
        const textResponse = document.getElementById('text-response');
        const submitTextBtn = document.getElementById('submit-text-btn');
        const hardRestartBtn = document.getElementById('hard-restart-btn');

        // Main function to carefully boot up speech detection without crashing
        function startListening() {
            if (!SpeechRecognition) {
                gameFeedback.innerHTML = "<span class='fail-text'>Speech recognition not supported in this browser. Please use the text box below!</span>";
                return;
            }

            // SAFETY: Force-kill any old hanging instances before starting fresh
            stopListeningEngine();

            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'it-IT';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    speakBtn.textContent = "Listening... Speak now!";
                    speakBtn.classList.add('mic-listening');
                    
                    // ANTI-FREEZE SAFETY NET: If the browser stays silent for 6 seconds, un-freeze automatically
                    backupTimeout = setTimeout(() => {
                        gameFeedback.innerHTML = "<span style='color: #ffc107;'>Audio timed out. Try speaking closer, or type your answer below!</span>";
                        stopListeningEngine();
                    }, 6000);
                };

                recognition.onresult = (event) => {
                    clearTimeout(backupTimeout);
                    const speechResult = event.results[0][0].transcript;
                    stopListeningEngine();
                    processInput(speechResult);
                };
                
                recognition.onerror = (err) => { 
                    clearTimeout(backupTimeout);
                    stopListeningEngine();
                    gameFeedback.innerHTML = `<span style='color: #aaa;'>Audio connection hitch. Feel free to use the manual text box below!</span>`;
                };

                recognition.onend = () => {
                    clearTimeout(backupTimeout);
                    // Ensure buttons revert to normal styling even if it cuts off
                    speakBtn.textContent = "🎤 Click & Speak";
                    speakBtn.classList.remove('mic-listening');
                };

                recognition.start();

            } catch (e) {
                stopListeningEngine();
            }
        }

        // Hard reset function for the audio engine to break loops
        function stopListeningEngine() {
            clearTimeout(backupTimeout);
            if (recognition) {
                try {
                    recognition.abort();
                } catch(e) {}
                recognition = null;
            }
            if (speakBtn) {
                speakBtn.textContent = "🎤 Click & Speak";
                speakBtn.classList.remove('mic-listening');
            }
        }

        if (speakBtn) {
            speakBtn.addEventListener('click', startListening);
        }

        submitTextBtn.addEventListener('click', () => {
            if(textResponse.value.trim() !== "") {
                stopListeningEngine();
                processInput(textResponse.value);
                textResponse.value = "";
            }
        });

        textResponse.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && textResponse.value.trim() !== "") {
                stopListeningEngine();
                processInput(textResponse.value);
                textResponse.value = "";
            }
        });

        hardRestartBtn.addEventListener('click', () => {
            stopListeningEngine();
            currentStep = 1;
            gameFeedback.innerHTML = "<span style='color: #aaa;'>Game fully rebooted. Welcome back to the gate!</span>";
            updateScene();
        });

        function processInput(rawInput) {
            const cleanInput = rawInput.toLowerCase().trim();
            
            // --- PASSPORT CONTROL ---
            if (currentStep === 1) {
                if (cleanInput.includes("buongiorno")) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Success! The officer accepts your passport.</span>`;
                    currentStep = 2;
                } else if (cleanInput.includes("ciao")) {
                    triggerReset('You used "Ciao". Too casual for a government official!');
                } else {
                    triggerReset('The officer looks confused. You should say "Buongiorno".');
                }
            } 
            else if (currentStep === 2) {
                if (cleanInput.includes("vacanza") || cleanInput.includes("vacanze")) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Success! Passport stamped.</span>`;
                    currentStep = 3;
                } else {
                    triggerReset('You failed to state you are here on vacation ("in vacanza").');
                }
            } 
            else if (currentStep === 3) {
                if (cleanInput.includes("grazie") && cleanInput.includes("arrivederci")) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Flawless! You walk through the airport gates into the station.</span>`;
                    currentStep = 4;
                } else {
                    triggerReset('You forgot to say "Grazie, arrivederci" before walking away.');
                }
            }
            
            // --- TRAIN STATION PLATFORM ---
            else if (currentStep === 4) {
                const containsDestination = cleanInput.includes("roma") || cleanInput.includes("rome");
                const containsPoliteness = cleanInput.includes("favore") || cleanInput.includes("prego") || cleanInput.includes("grazie") || cleanInput.includes("please");
                
                if (containsDestination && containsPoliteness) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Great job! The agent prints out your physical paper ticket.</span>`;
                    currentStep = 5;
                } else {
                    triggerReset('To buy the ticket, ask for your destination politely. Try saying or typing: "Un biglietto per Roma, per favore."');
                }
            }
            else if (currentStep === 5) {
                if (cleanInput.includes("grazie") || cleanInput.includes("ecco") || cleanInput.includes("thank")) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><span class='success-text'>Polite exchange complete. You pick up the ticket.</span>`;
                    currentStep = 6;
                } else {
                    triggerReset('You grabbed the ticket silently without saying thank you ("Grazie").');
                }
            }
            else if (currentStep === 6) {
                if (cleanInput.includes("convalidare") || cleanInput.includes("stamp") || cleanInput.includes("convalido") || cleanInput.includes("validate")) {
                    gameFeedback.innerHTML = `You entered: <span class='heard-text'>"${rawInput}"</span><br><br><span class='success-text'>★ EXCELLENT! ★</span><br>You successfully stamped your ticket in the yellow machine before boarding! You bypass the massive fine and head safely toward Rome.`;
                    currentStep = 7;
                } else {
                    triggerReset('CRITICAL ERROR: You boarded the train with an unstamped ticket! The conductor hits you with a massive €50 fine.');
                }
            }

            updateScene();
        }

        function updateScene() {
            if (currentStep <= 3) {
                locationTitle.textContent = "STAGE 1: AIRPORT DESK";
                gameStatus.textContent = `Step ${currentStep} of 6`;
            } else if (currentStep > 3 && currentStep <= 6) {
                locationTitle.textContent = "STAGE 2: TRAIN STATION PLATFORM";
                gameStatus.textContent = `Step ${currentStep} of 6`;
            }

            if (currentStep === 1) {
                officerSpeech.textContent = '"Passaporto, prego."';
                officerTranslation.textContent = '(Passport, please.)';
            } else if (currentStep === 2) {
                officerSpeech.textContent = '"Qual è il motivo del viaggio?"';
                officerTranslation.textContent = '(What is the purpose of your journey?)';
            } else if (currentStep === 3) {
                officerSpeech.textContent = '"Benvenuto in Italia."';
                officerTranslation.textContent = '(Welcome to Italy.)';
            } else if (currentStep === 4) {
                officerSpeech.textContent = '"Buongiorno! Dove va?"';
                officerTranslation.textContent = '(Good morning! Where are you going?)';
                gameFeedback.innerHTML = `<span style="color: #aaa;">Tip: Ask for a ticket to Rome using "per favore". (Example: "Un biglietto per Roma, per favore")</span>`;
            } else if (currentStep === 5) {
                officerSpeech.textContent = '"Sono quindici euro, prego."';
                officerTranslation.textContent = '(That is 15 euros, please.)';
                gameFeedback.innerHTML = `<span style="color: #aaa;">Tip: Say thank you ("Grazie") when paying.</span>`;
            } else if (currentStep === 6) {
                officerSpeech.textContent = '"Ecco il biglietto. Buon viaggio!"';
                officerTranslation.textContent = '(Here is your ticket. Have a good trip!)';
                gameFeedback.innerHTML = `<span style="color: #ffc107; font-weight:bold;">⚠️ CULTURAL WARNING: Your train is here. What must you do to your ticket before boarding so you don't get fined?</span>`;
            } else if (currentStep === 7) {
                locationTitle.textContent = "LEVEL 1 PART 1 COMPLETE";
                gameStatus.textContent = "VICTORY";
                officerSpeech.textContent = '"Prossima fermata: Il tuo Hotel!"';
                officerTranslation.textContent = '(Next stop: Your Hotel!)';
                document.getElementById('input-fallback-zone').style.display = "none";
                if(speakBtn) speakBtn.style.display = "none";
            }
        }

        function triggerReset(reason) {
            currentStep = 1;
            gameFeedback.innerHTML = `<span class='fail-text'>FAIL / RESET!</span><br>${reason}<br><br><span style="color: #aaa;">Sent all the way back to the passport customs line to try your trip again!</span>`;
            updateScene();
        }
    </script>
</body>
</html>
