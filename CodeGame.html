<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Codec - Online Multiplayer</title>
    <!-- Three.js for 3D Board -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #1f2833;
            border: 2px solid #66fcf1;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
            text-align: center;
        }

        .modal-card h2 {
            color: #66fcf1;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #45a29e;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a29e;
        }

        /* In-Game UI Overlay */
        #ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(31, 40, 51, 0.9);
            border: 1px solid #66fcf1;
            border-radius: 10px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .game-controls {
            display: flex;
            gap: 10px;
        }

        .game-controls input {
            flex: 1;
            padding: 8px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 4px;
            color: #fff;
        }

        .game-controls button {
            width: auto;
            padding: 8px 16px;
        }

        #status-msg {
            color: #66fcf1;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Connection Modal -->
    <div id="code-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Online Room Match</h2>
            
            <div class="input-group">
                <label for="player-role">I am:</label>
                <select id="player-role">
                    <option value="1">Player 1 (Host)</option>
                    <option value="2">Player 2 (Guest)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="room-code-input">Shared Room Code:</label>
                <input type="text" id="room-code-input" placeholder="e.g. MATCH123" value="Match123">
            </div>

            <div class="input-group">
                <label for="my-passcode-input">Your Secret Cipher Key:</label>
                <input type="password" id="my-passcode-input" placeholder="Enter passcode...">
            </div>

            <button onclick="joinOnlineRoom()">Connect & Start Game</button>
            <div id="status-msg" style="display:none;">Connecting to Supabase...</div>
        </div>
    </div>

    <!-- Active Game UI Controls -->
    <div id="ui-overlay">
        <div id="turn-indicator" style="text-align: center; font-weight: bold; color: #66fcf1;">
            Game Active
        </div>
        <div class="game-controls">
            <input type="text" id="declared-word-input" placeholder="Type your word to declare..." />
            <button id="declare-word-btn" onclick="declareWord()">Declare Word</button>
        </div>
    </div>

    <script>
        // --- SUPABASE SETUP ---
        // Replace with your project URL and public Anon Key if needed
        const SUPABASE_URL = "https://jpgoyisaouzbzqbihain.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwZ295aXNhb3V6YnpxYmloYWluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDk3NDIsImV4cCI6MjA1NjgyNTc0Mn0.RzUqR9M9Z_-z9Kq55A_I4X6L94M9X8Z_RzUqR9M9Z_"; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Game State Variables
        let myRole = 1;
        let roomCode = '';
        let myCipherData = null;
        let gameChannel = null;
        let scene, camera, renderer, boardMesh;

        // --- JOIN / CONNECT LOGIC ---
        async function joinOnlineRoom() {
            myRole = parseInt(document.getElementById('player-role').value);
            roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
            const myPasscode = document.getElementById('my-passcode-input').value.trim();

            if (!roomCode || !myPasscode) {
                alert("Please enter both a Room Code and your Passcode!"); 
                return;
            }

            const statusMsg = document.getElementById('status-msg');
            statusMsg.style.display = 'block';

            try {
                // 1. Query Supabase using 'Code' column
                const { data, error } = await supabaseClient
                    .from('codelock')
                    .select('*')
                    .eq('Code', myPasscode);

                if (error) {
                    console.error("Supabase Query Error:", error);
                    alert("Error querying Supabase: " + error.message);
                    statusMsg.style.display = 'none';
                    return;
                }

                if (!data || data.length === 0) {
                    alert(`Passcode "${myPasscode}" was not found in Supabase!`);
                    statusMsg.style.display = 'none';
                    return;
                }

                // 2. Extract drawing data from JSON structure
                const rawData = data[0].alphabet_data;
                myCipherData = (rawData && rawData.alphabet) ? rawData.alphabet : rawData;

                // 3. Connect to Supabase Realtime (Enabling 'self: true' for single-device testing)
                gameChannel = supabaseClient.channel(`game_${roomCode}`, {
                    config: {
                        broadcast: { self: true }
                    }
                });

                gameChannel.on('broadcast', { event: 'game_move' }, payload => {
                    handleRemoteEvent(payload.payload);
                }).subscribe(status => {
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('code-modal').style.display = 'none';
                        document.getElementById('ui-overlay').style.display = 'flex';
                        init3DScene();
                        alert(`Connected to Room: ${roomCode}!`);
                    }
                });

            } catch (err) {
                console.error("Unexpected Error:", err);
                alert("An unexpected error occurred during connection.");
                statusMsg.style.display = 'none';
            }
        }

        // --- DECLARE WORD LOGIC ---
        async function declareWord() {
            const wordInput = document.getElementById('declared-word-input');
            const word = wordInput ? wordInput.value.trim().toUpperCase() : '';

            if (!word) {
                alert("Please enter a word to declare!");
                return;
            }

            const moveData = {
                type: 'DECLARE_WORD',
                player: myRole,
                declaredWord: word,
                timestamp: Date.now()
            };

            // Send move via Realtime if connected, or process locally
            if (gameChannel) {
                await gameChannel.send({
                    type: 'broadcast',
                    event: 'game_move',
                    payload: moveData
                });
            } else {
                handleRemoteEvent(moveData);
            }

            if (wordInput) wordInput.value = '';
        }

        // --- HANDLE INCOMING GAME MOVES ---
        function handleRemoteEvent(data) {
            if (data.type === 'DECLARE_WORD') {
                const playerLabel = data.player === 1 ? "Player 1 (Host)" : "Player 2 (Guest)";
                alert(`${playerLabel} declared the word: "${data.declaredWord}"!`);
            }
        }

        // --- BASIC THREE.JS 3D SCENE SETUP ---
        function init3DScene() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0c10);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x66fcf1, 0.8);
            dirLight.position.set(5, 15, 5);
            scene.add(dirLight);

            // 3D Game Board
            const boardGeo = new THREE.BoxGeometry(8, 0.4, 8);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x1f2833, roughness: 0.4 });
            boardMesh = new THREE.Mesh(boardGeo, boardMat);
            scene.add(boardMesh);

            // Render loop
            function animate() {
                requestAnimationFrame(animate);
                if (boardMesh) boardMesh.rotation.y += 0.002; // subtle slow rotation
                renderer.render(scene, camera);
            }
            animate();

            // Window resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
