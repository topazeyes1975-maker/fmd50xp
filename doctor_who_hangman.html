<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don't Blink: The Paradox Protocol</title>
    <style>
        /* Fit-to-Screen Layout */
        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }

        h2 { font-size: 4vh; margin: 0; letter-spacing: 2px; color: #888; }

        #game-view {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 40vh;
            background: #111;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }

        #angel-image {
            max-height: 100%;
            transition: opacity 0.1s ease; /* Quick blink effect */
        }

        #word-container {
            font-size: 4vh;
            letter-spacing: 4px;
            font-weight: bold;
            color: #00d4ff;
            text-align: center;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 500px;
        }

        button {
            height: 6vh;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            font-size: 2vh;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:disabled { opacity: 0.1; }

        .reset-btn {
            width: 100%;
            height: 5vh;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #555;
            font-size: 1.5vh;
            border-radius: 4px;
        }
    </style>
</head>
<body class="stage-0">

    <h2>THE PARADOX PROTOCOL</h2>

    <div id="game-view">
        <img id="angel-image" src="" alt="Quantum Entity">
    </div>

    <div id="word-container">_ _ _ _ _</div>
    
    <div class="keyboard" id="keyboard"></div>

    <button class="reset-btn" onclick="start()">RE-SYNC TIMELINE</button>

    <script>
        const words = ["GALLIFREY", "WEEPING", "STATUE", "QUANTUM", "BLINK", "STONE", "TIMELORD"];
        
        // Ensure these file names match your GitHub files exactly
        const angelImages = [
            "1778724937602.png",
            "1778724987591.png",
            "1778725109212.png",
            "1778725159799.png",
            "1778725463615.png",
            "https://raw.githubusercontent.com/abunaia/abunaia.github.io/main/angel5.png"
        ];

        let targetWord = "";
        let mistakes = 0;
        let guessed = [];

        function start() {
            targetWord = words[Math.floor(Math.random() * words.length)];
            guessed = [];
            mistakes = 0;
            updateAngelImage();
            render();
            makeKeys();
        }

        function updateAngelImage() {
            const imgElement = document.getElementById('angel-image');
            // Blink Effect: Hide then show with new source
            imgElement.style.opacity = "0";
            setTimeout(() => {
                imgElement.src = angelImages[mistakes];
                imgElement.style.opacity = "1";
            }, 100);
        }

        function makeKeys() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const b = document.createElement('button');
                b.innerText = l;
                b.onclick = () => guess(l, b);
                kb.appendChild(b);
            });
        }

        function guess(letter, btn) {
            btn.disabled = true;
            if(targetWord.includes(letter)) {
                guessed.push(letter);
            } else {
                mistakes++;
                if (mistakes < angelImages.length) {
                    updateAngelImage();
                }
            }
            render();
        }

        function render() {
            const display = targetWord.split('').map(l => guessed.includes(l) ? l : "_").join(' ');
            document.getElementById('word-container').innerText = display;

            if(!display.includes("_")) {
                setTimeout(() => { alert("You survived the encounter."); start(); }, 300);
            } else if (mistakes >= 5) {
                setTimeout(() => { alert("YOU BLINKED."); start(); }, 300);
            }
        }

        // Start the game for the first time
        start();
    </script>
</body>
</html>
