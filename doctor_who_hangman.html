<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don't Blink: Fit-to-Screen</title>
    <style>
        /* This CSS block is the "Universal Fit" you can use for all your games */
        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Spreads content to fill the height */
            height: 100vh; /* Forces body to exactly the height of the screen */
            margin: 0;
            padding: 15px;
            overflow: hidden; /* Prevents accidental scrolling */
        }

        h2 { font-size: 5vh; margin: 0; letter-spacing: 2px; color: #888; }

        #game-view {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 35vh; /* Takes up exactly 35% of the screen height */
            background: #111;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }

        #angel-image {
            max-height: 100%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Movement Stages - using the "scale" trick we discussed */
        .stage-1 #angel-image { transform: scale(1.4); }
        .stage-2 #angel-image { transform: scale(2.0); }
        .stage-3 #angel-image { transform: scale(2.8); }
        .stage-4 #angel-image { transform: scale(3.8); filter: contrast(150%); }
        .stage-5 #angel-image { transform: scale(5.5); filter: contrast(200%) sepia(100%) hue-rotate(-50deg); }

        #word-container {
            font-size: 4vh; /* Font size based on screen height */
            letter-spacing: 4px;
            font-weight: bold;
            color: #00d4ff;
            text-align: center;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 5px;
        }

        button {
            height: 6vh; /* Buttons are sized to be easy to tap on mobile */
            background: #222;
            color: #fff;
            border: 1px solid #444;
            font-size: 2vh;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:disabled { opacity: 0.1; }

        .reset-btn {
            width: 100%;
            height: 5vh;
            background: #333;
            margin-top: 5px;
            font-size: 1.5vh;
            border: none;
            color: #888;
        }
    </style>
</head>
<body class="stage-0">

    <h2>THE PARADOX PROTOCOL</h2>

    <div id="game-view">
        <!-- Once you have your Angel GLB or PNG, update this SRC -->
        <img id="angel-image" src="1778725744187.png" alt="Weeping Angel">
    </div>

    <div id="word-container">_ _ _ _ _</div>
    
    <div class="keyboard" id="keyboard"></div>

    <button class="reset-btn" onclick="start()">RE-SYNC TIMELINE</button>

    <script>
    const words = ["GALLIFREY", "WEEPING", "STATUE", "QUANTUM", "BLINK", "STONE", "TIMELORD"];
    
    // 1. List your 6 images here in order from "Far Away" to "Attack"
    const angelImages = [
        "1778725744187.png", // 0 mistakes (Far away)
        "1778725543182.png", // 1 mistake
        "1778725159799.png", // 2 mistakes
        "1778725109212.png", // 3 mistakes
        "1778724987591.png", // 4 mistakes
        "1778724937602.png"  // 5 mistakes (In your face!)
    ];

    let targetWord = "";
    let mistakes = 0;
    let guessed = [];

    function start() {
        targetWord = words[Math.floor(Math.random() * words.length)];
        guessed = [];
        mistakes = 0;
        updateAngelImage(); // Reset image to index 0
        render();
        makeKeys();
    }

    // 2. This function swaps the "src" of your image tag
    function updateAngelImage() {
        const imgElement = document.getElementById('angel-image');
        // This looks at your mistakes and picks the right image from the list
        imgElement.src = angelImages[mistakes]; 
    }

    function makeKeys() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.innerText = l;
            b.onclick = () => guess(l, b);
            kb.appendChild(b);
        });
    }

    function guess(letter, btn) {
        btn.disabled = true;
        if(targetWord.includes(letter)) {
            guessed.push(letter);
        } else {
            mistakes++;
            // 3. Every time a mistake happens, swap the image!
            if (mistakes < angelImages.length) {
                updateAngelImage();
            }
        }
        render();
    }

    function render() {
        const display = targetWord.split('').map(l => guessed.includes(l) ? l : "_").join(' ');
        document.getElementById('word-container').innerText = display;

        if(!display.includes("_")) {
            setTimeout(() => { alert("You survived."); start(); }, 200);
        } else if (mistakes >= 5) {
            setTimeout(() => { alert("YOU BLINKED."); start(); }, 200);
        }
    }

    start();
</script>

</body>
</html>
