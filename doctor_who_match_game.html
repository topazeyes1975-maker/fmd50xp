<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doctor Who: Time Loop Matcher</title>
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; touch-action: manipulation; }
        
        body {
            background-color: #050505; 
            color: #d1d1d1; 
            font-family: 'Garamond', serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden;
        }

        h2 { 
            font-size: 1.8rem; 
            margin: 0 0 5px 0; 
            letter-spacing: 3px; 
            color: #00f0ff; 
            text-align: center; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* SCOREBOARD & STATUS TERMINAL */
        .dashboard {
            width: 100%;
            max-width: 400px;
            background: rgba(10, 25, 40, 0.6);
            border: 1px dashed #00f0ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .stat-box span {
            color: #00f0ff;
            font-weight: bold;
        }

        #timer.warning {
            color: #ff0055;
            animation: blink 0.5s infinite alternate;
        }

        /* DYNAMIC LEVEL BOARD GRID */
        .game-container {
            display: grid;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            perspective: 1000px; /* Essential for 3D card flipping effect */
            margin-bottom: 20px;
        }

        /* DYNAMIC CARD COMPONENT */
        .card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* CARD BACK (THE CHAMELEON TARDIS BLUE CIRCUITRY) */
        .card-back {
            background: radial-gradient(circle, #0c2340, #040b14);
            border: 2px solid #00f0ff;
            color: #00f0ff;
            font-size: 2.2rem;
        }

        /* CARD FRONT (THE REVEALED WHO-ASSET) */
        .card-front {
            background: #111;
            border: 2px solid #a855f7;
            transform: rotateY(180deg);
            overflow: hidden;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* OVERLAY SYSTEM BANNER */
        .game-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .overlay-content {
            text-align: center;
            max-width: 300px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #00f0ff;
            background: #0a111a;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .overlay-title {
            font-size: 1.6rem;
            color: #ff0055;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .overlay-btn {
            background: #00f0ff;
            color: #050505;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <h2>TIME LOOP MATCHER</h2>
    
    <div class="dashboard">
        <div class="stat-box">LEVEL: <span id="level-display">1</span></div>
        <div class="stat-box">TIME LEFT: <span id="timer">50</span>s</div>
    </div>

    <div id="game-board" class="game-container"></div>

    <div id="overlay" class="game-overlay">
        <div class="overlay-content">
            <div id="overlay-title" class="overlay-title">TIME LOOP BROKEN!</div>
            <p id="overlay-text">The paradox collapsed! You were dragged back to Level 1.</p>
            <button id="overlay-action-btn" class="overlay-btn" onclick="closeOverlay()">Re-Enter Loop</button>
        </div>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const levelDisplay = document.getElementById('level-display');
        const timerDisplay = document.getElementById('timer');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');
        const overlayBtn = document.getElementById('overlay-action-btn');

        // ==========================================
        // 🚨 FONDA'S OPEN ASSET STORAGE BANK
        // Replace the emojis inside the strings with your image paths later!
        // Example: "images/dalek.png" instead of "🤖"
        // ==========================================
        const doctorWhoImages = [
            "🚀", // TARDIS / Space Travel
            "⌛", // Time Vortex
            "🤖", // Cyberman / Dalek
            "🧣", // Fourth Doctor Scarf
            "👑", // Time Lord Crown
            "🌌", // Gallifreyan Nebula
            "🕶️", // Sonic Sunglasses
            "🏛️", // Matrix Matrix Archive
            "🧬", // Regeneration Energy
            "⚡"  // Paradox Crack in Time
        ];

        // GAME CONFIGURATION MULTIPLIER RULES
        const levelsConfig = {
            1: { cols: 3, rows: 4, pairs: 6, time: 50 },
            2: { cols: 4, rows: 4, pairs: 8, time: 40 },
            3: { cols: 4, rows: 5, pairs: 10, time: 30 }
        };

        let currentLevel = 1;
        let selectedCards = [];
        let matchedCount = 0;
        let gameTimer = null;
        let timeLeft = 0;
        let lockGrid = false;

        function initGame() {
            setupLevel(currentLevel);
        }

        function setupLevel(level) {
            board.innerHTML = "";
            selectedCards = [];
            matchedCount = 0;
            lockGrid = false;
            clearInterval(gameTimer);
            
            levelDisplay.innerText = level;
            const config = levelsConfig[level];
            timeLeft = config.time;
            timerDisplay.innerText = timeLeft;
            timerDisplay.classList.remove('warning');

            // Set grid columns structural engine rule
            board.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;

            // Gather elements and slice pool to required pairs size
            let levelAssets = doctorWhoImages.slice(0, config.pairs);
            let cardDeck = [...levelAssets, ...levelAssets]; // Duplicate to form pairs
            
            // Randomize array matrix
            cardDeck.sort(() => Math.random() - 0.5);

            // Construct DOM nodes
            cardDeck.forEach((asset, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = index;
                card.dataset.value = asset;
                card.onclick = () => flipCard(card);

                // Check if user set an image track or left an emoji component behind
                const isImageFile = asset.includes('.') || asset.includes('/');
                const innerFrontElement = isImageFile 
                    ? `<img src="${asset}" alt="Who Clue" draggable="false">` 
                    : asset;

                card.innerHTML = `
                    <div class="card-face card-back">🌌</div>
                    <div class="card-face card-front">${innerFrontElement}</div>
                `;
                board.appendChild(card);
            });

            startCountdown();
        }

        function startCountdown() {
            gameTimer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 10) {
                    timerDisplay.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    triggerFailureReset();
                }
            }, 1000);
        }

        function flipCard(card) {
            if (lockGrid || card.classList.contains('flipped') || selectedCards.includes(card)) return;

            card.classList.add('flipped');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockGrid = true;
            const [card1, card2] = selectedCards;
            const isMatch = card1.dataset.value === card2.dataset.value;

            if (isMatch) {
                matchedCount++;
                selectedCards = [];
                lockGrid = false;

                // Check if whole grid has been synchronized
                if (matchedCount === levelsConfig[currentLevel].pairs) {
                    clearInterval(gameTimer);
                    setTimeout(triggerLevelSuccess, 500);
                }
            } else {
                // Return cards face down if failed matching check
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    selectedCards = [];
                    lockGrid = false;
                }, 800);
            }
        }

        // LEVEL WON SYSTEM
        function triggerLevelSuccess() {
            if (currentLevel < 3) {
                currentLevel++;
                overlayTitle.innerText = "TIME LOOP RESTORED!";
                overlayTitle.style.color = "#00f0ff";
                overlayText.innerText = `Excellent work, Doctor! Advance to Level ${currentLevel}. The vortex is collapsing faster!`;
                overlayBtn.innerText = `Enter Level ${currentLevel}`;
                overlay.style.display = 'flex';
            } else {
                // Absolute Victory Loop
                overlayTitle.innerText = "TIMELORD SUPREME!";
                overlayTitle.style.color = "#a855f7";
                overlayText.innerText = "You fixed the entire paradox pipeline and completely synchronized the matrix!";
                overlayBtn.innerText = "Restart Chronos Suite";
                currentLevel = 1; // Loop back round cleanly
                overlay.style.display = 'flex';
            }
        }

        // HIGH STAKES FAILURE RESET RULE
        function triggerFailureReset() {
            lockGrid = true;
            currentLevel = 1; // Wipes out progress instantly
            overlayTitle.innerText = "PARADOX EXPLOSION!";
            overlayTitle.style.color = "#ff0055";
            overlayText.innerText = "The clock hit zero! The loop fractured, resetting your matrix anchor to Level 1.";
            overlayBtn.innerText = "Reset Chronometer";
            overlay.style.display = 'flex';
        }

        function closeOverlay() {
            overlay.style.display = 'none';
            setupLevel(currentLevel);
        }

        // Start initialization sequence
        window.onload = initGame;
    </script>
</body>
</html>
