<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chompy Monster Scrambler Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a24;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #3a3a52;
      /* SET YOUR BACKGROUND IMAGE URL HERE */
      background-image: url('images/game_background.png');
      background-size: cover;
      background-position: center;
    }
    canvas {
      display: block;
      /* Soft backdrop overlay ensures characters pop against any background image */
      background-color: rgba(15, 15, 23, 0.85); 
    }
    #ui-layer {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .hud-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #game-over-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    h1 {
      font-size: 42px;
      color: #ff4757;
      margin-bottom: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #2ed573;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    button:hover {
      background: #26af5f;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-layer">
      <div class="hud-box">Score: <span id="score">0</span></div>
      <div class="hud-box">Tier: <span id="tier">Yellow (1)</span></div>
      <div class="hud-box">Health: <span id="health">100%</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="game-over-screen">
      <h1>GAME OVER</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ==========================================
    // IMAGE ASSET MANAGER
    // Load your custom file paths here!
    // ==========================================
    const IMAGES = {
      // Main Center Player & Animations
      player: new Image(),
      mouthOpen: new Image(),
      mouthClosed: new Image(),

      // Center Scrambler Hub
      spinnerCenter: new Image(),

      // Custom Scoopers (Yellow, Blue, Red, Broken)
      bucketYellow: new Image(),
      bucketBlue: new Image(),
      bucketRed: new Image(),
      bucketBroken: new Image(),

      // Floating Chompy Monsters
      greenTarget: new Image(),
      yellowTarget: new Image(),
      redTarget: new Image(),
      purpleTarget: new Image()
    };

    // --- ASSIGN YOUR IMAGE FILE PATHS HERE ---
     IMAGES.spinnerCenter.src = 'images/center_hub.png';
     IMAGES.bucketYellow.src  = '1790167375036~4.jpg';
    IMAGES.bucketBlue.src    = '1790167375036~3.jpg';
     IMAGES.bucketRed.src     = '1790167375036~2.jpg';
     IMAGES.bucketBroken.src  = '1790167375036~5.jpg';
    IMAGES.greenTarget.src   = 'images/chompy_green.png';
    IMAGES.yellowTarget.src  = 'images/chompy_yellow.png';
    IMAGES.redTarget.src     = '1790167868287.png';
    IMAGES.purpleTarget.src  = 'images/chompy_purple.png';

    // Game State
    let score = 0;
    let scoopTier = 1; // 1 = Yellow, 2 = Blue, 3+ = Red
    let health = 100;
    let gameOver = false;
    let keys = {};

    // Player Object
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      speed: 4,
      angle: 0,
      spinSpeed: 0.05,
      blades: [true, true, true, true] // 4 Scoopers active
    };

    // Floating Monster Array
    const monsters = [];

    // Keyboard Listeners
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Spawn Chompy Monsters
    function spawnMonster() {
      if (gameOver) return;
      const types = [
        { color: '#2ed573', speed: 1.5, hp: 1, points: 10, img: IMAGES.greenTarget },
        { color: '#eccc68', speed: 2.2, hp: 1, points: 20, img: IMAGES.yellowTarget },
        { color: '#ff4757', speed: 1.0, hp: 3, points: 50, img: IMAGES.redTarget },
        { color: '#a29bfe', speed: 3.0, hp: 1, points: 30, img: IMAGES.purpleTarget }
      ];

      const type = types[Math.floor(Math.random() * types.length)];
      
      // Spawn around outer edges
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -20 : canvas.width + 20;
        y = Math.random() * canvas.height;
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -20 : canvas.height + 20;
      }

      monsters.push({
        x, y,
        radius: 16,
        type: type,
        hp: type.hp
      });
    }

    setInterval(spawnMonster, 1200);

    function update() {
      if (gameOver) return;

      // Player Movement Controls
      if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
      if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

      // Clamp Player inside screen
      player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
      player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

      // Rotate Scrambler Arms
      player.angle += player.spinSpeed;

      // Upgrade tier unlocks as score increases
      if (score >= 200 && scoopTier < 2) scoopTier = 2;
      if (score >= 500 && scoopTier < 3) scoopTier = 3;

      // Update Monsters & Collision Checking
      const bladeDistance = 35;
      const step = (Math.PI * 2) / player.blades.length;

      for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];

        // Move towards center player
        const dx = player.x - m.x;
        const dy = player.y - m.y;
        const dist = Math.hypot(dx, dy);

        m.x += (dx / dist) * m.type.speed;
        m.y += (dy / dist) * m.type.speed;

        // Check collision with each rotating scooper
        for (let b = 0; b < player.blades.length; b++) {
          const bladeAngle = player.angle + b * step;
          const bx = player.x + Math.cos(bladeAngle) * bladeDistance;
          const by = player.y + Math.sin(bladeAngle) * bladeDistance;

          const hitDist = Math.hypot(bx - m.x, by - m.y);

          if (hitDist < m.radius + 14) {
            if (player.blades[b]) {
              // Intact Scooper hits monster
              m.hp--;
              if (m.hp <= 0) {
                score += m.type.points;
                monsters.splice(i, 1);
                break;
              }
            } else {
              // Broken Scooper takes extra damage penalty
              health -= 2;
            }
          }
        }

        // Center Collision (Monster reaches the player core)
        if (dist < 20) {
          health -= 10;
          monsters.splice(i, 1);

          // Break one random active scooper on direct impact
          const activeIndices = player.blades.map((v, idx) => v ? idx : -1).filter(v => v !== -1);
          if (activeIndices.length > 0) {
            const breakIdx = activeIndices[Math.floor(Math.random() * activeIndices.length)];
            player.blades[breakIdx] = false;
          }

          if (health <= 0) {
            health = 0;
            triggerGameOver();
          }
        }
      }

      // Update HUD Text
      document.getElementById('score').innerText = score;
      document.getElementById('health').innerText = `${health}%`;
      
      const tierName = scoopTier === 1 ? 'Yellow (1)' : scoopTier === 2 ? 'Blue (2)' : 'Red (3)';
      document.getElementById('tier').innerText = tierName;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 1. DRAW SCRAMBLER CENTER & ARMS ---
      const bladeDistance = 35;
      const step = (Math.PI * 2) / player.blades.length;

      for (let i = 0; i < player.blades.length; i++) {
        const bladeAngle = player.angle + i * step;
        const bx = player.x + Math.cos(bladeAngle) * bladeDistance;
        const by = player.y + Math.sin(bladeAngle) * bladeDistance;

        // Draw Arm Line
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(bx, by);
        ctx.stroke();

        // Draw Custom Scooper Image or State
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(player.angle * 2);

        if (player.blades[i]) {
          // Choose active tier sprite
          let currentScooper = IMAGES.bucketYellow;
          if (scoopTier === 2) currentScooper = IMAGES.bucketBlue;
          if (scoopTier >= 3) currentScooper = IMAGES.bucketRed;

          if (currentScooper.complete && currentScooper.src) {
            ctx.drawImage(currentScooper, -14, -14, 28, 28);
          } else {
            // Fallback shape if no image is loaded
            ctx.fillStyle = scoopTier === 1 ? '#f1c40f' : scoopTier === 2 ? '#3498db' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Broken Scooper state
          if (IMAGES.bucketBroken.complete && IMAGES.bucketBroken.src) {
            ctx.drawImage(IMAGES.bucketBroken, -14, -14, 28, 28);
          } else {
            // Fallback broken marker
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // --- 2. DRAW CENTER HUB IMAGE ---
      ctx.save();
      ctx.translate(player.x, player.y);
      if (IMAGES.spinnerCenter.complete && IMAGES.spinnerCenter.src) {
        ctx.drawImage(IMAGES.spinnerCenter, -20, -20, 40, 40);
      } else {
        // Fallback center core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // --- 3. DRAW CHOMPY MONSTERS ---
      monsters.forEach(m => {
        if (m.type.img.complete && m.type.img.src) {
          ctx.drawImage(m.type.img, m.x - 18, m.y - 18, 36, 36);
        } else {
          // Fallback colored circle if image path not assigned yet
          ctx.fillStyle = m.type.color;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      gameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over-screen').classList.add('active');
    }

    function resetGame() {
      score = 0;
      scoopTier = 1;
      health = 100;
      gameOver = false;
      player.blades = [true, true, true, true];
      monsters.length = 0;
      document.getElementById('game-over-screen').classList.remove('active');
      requestAnimationFrame(gameLoop);
    }

    // Start Game Loop
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
