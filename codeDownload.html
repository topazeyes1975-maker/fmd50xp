<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Mobile Flasher</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h2 { margin-top: 0; font-size: 20px; }
    .group { margin-bottom: 16px; }
    label { font-size: 13px; color: var(--subtext); display: block; margin-bottom: 6px; }
    select, input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { background: #334155; color: #64748b; }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s ease;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      height: 120px;
      overflow-y: auto;
      color: #38bdf8;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Mobile Hardware Flasher</h2>

  <!-- Board Selector -->
  <div class="group">
    <label>1. Target Microcontroller</label>
    <select id="boardSelect">
      <option value="115200">Arduino Uno / Nano (ATmega328P - 115200)</option>
      <option value="57600">Arduino Nano Old Bootloader / Pro Mini (57600)</option>
      <option value="921600">ESP32 / ESP8266 (High Speed 921600)</option>
    </select>
  </div>

  <!-- File Input or Preset Loader -->
  <div class="group">
    <label>2. Select .HEX File or Load Saved Routine</label>
    <input type="file" id="fileInput" accept=".hex">
  </div>

  <!-- USB Action Buttons -->
  <button id="connectBtn">3. Connect OTG Hardware</button>
  <button id="flashBtn" disabled>4. Flash Code to System</button>

  <!-- Progress Tracking -->
  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <!-- Status Console -->
  <div id="console">Ready. Plug USB OTG cable into phone and tap Connect.</div>
</div>

<script>
  let port;
  let parsedBytes = null;

  const log = (msg) => {
    const c = document.getElementById('console');
    c.innerText += '\n> ' + msg;
    c.scrollTop = c.scrollHeight;
  };

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      parsedBytes = parseIntelHex(evt.target.result);
      log(`Loaded ${file.name} (${parsedBytes.length} bytes parsed)`);
      checkReady();
    };
    reader.readAsText(file);
  });

  document.getElementById('connectBtn').addEventListener('click', async () => {
    if (!("serial" in navigator)) {
      log("Web Serial not supported in this browser. Use Chrome on Android.");
      return;
    }
    try {
      const baud = parseInt(document.getElementById('boardSelect').value);
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: baud });
      log("USB Connected at " + baud + " baud!");
      checkReady();
    } catch (err) {
      log("Connection failed: " + err.message);
    }
  });

  function checkReady() {
    if (port && parsedBytes) {
      document.getElementById('flashBtn').disabled = false;
    }
  }

  document.getElementById('flashBtn').addEventListener('click', async () => {
    if (!port || !parsedBytes) return;

    try {
      log("Resetting board into Bootloader mode...");
      await port.setSignals({ dataTerminalReady: false, requestToSend: true });
      await new Promise(r => setTimeout(r, 250));
      await port.setSignals({ dataTerminalReady: true, requestToSend: false });
      await new Promise(r => setTimeout(r, 100));

      log("Flashing binary payload...");
      const writer = port.writable.getWriter();
      const chunkSize = 64;
      const total = parsedBytes.length;

      for (let i = 0; i < total; i += chunkSize) {
        const chunk = parsedBytes.slice(i, i + chunkSize);
        await writer.write(chunk);
        
        // Progress Bar Update
        const percent = Math.min(100, Math.round(((i + chunkSize) / total) * 100));
        document.getElementById('progressFill').style.width = percent + '%';
        await new Promise(r => setTimeout(r, 12));
      }

      writer.releaseLock();
      log("SUCCESS: Flash complete! Hardware is running.");
    } catch (err) {
      log("Flash Error: " + err.message);
    }
  });

  function parseIntelHex(hex) {
    const lines = hex.split('\n');
    let bytes = [];
    for (let line of lines) {
      line = line.trim();
      if (!line.startsWith(':')) continue;
      const count = parseInt(line.substr(1, 2), 16);
      const type = parseInt(line.substr(7, 2), 16);
      if (type === 0) {
        for (let i = 0; i < count; i++) {
          bytes.push(parseInt(line.substr(9 + (i * 2), 2), 16));
        }
      }
    }
    return new Uint8Array(bytes);
  }
</script>
</body>
</html>
